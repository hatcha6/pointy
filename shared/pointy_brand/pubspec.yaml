name: pointy_brand
description: "The Daftar (دفتر) brand shared by the company's Flutter apps: colours, the Arabic type face, payment-method marks and logos."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.10.7
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
  assets:
    - assets/branding/
    - assets/payment_methods/
