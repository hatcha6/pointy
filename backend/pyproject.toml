[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pointy-backend"
version = "0.1.0"
description = "Django REST backend for Pointy POS."
requires-python = ">=3.12"
dependencies = [
  "arabic-reshaper>=3,<4",
  "celery[redis]>=5.4,<6",
  "cryptography>=43,<48",
  "django>=5.1,<6",
  "django-cors-headers>=4.4,<5",
  "django-environ>=0.11,<1",
  "django-filter>=24.3,<26",
  "django-redis>=5.4,<6",
  "djangorestframework>=3.15,<4",
  "drf-spectacular>=0.27,<1",
  "phonenumbers>=8,<10",
  "pillow>=10,<12",
  # Lets Pillow decode HEIC/HEIF (every iPhone photo) so product-image uploads
  # in those formats are re-encoded to JPEG rather than stored as an invisible
  # tile. Ships manylinux/macOS/Windows wheels with libheif bundled, so no
  # system package is needed in the backend image.
  "pillow-heif>=1,<2",
  "psycopg[binary]>=3.2,<4",
  # SQL Server is the most common legacy POS backend, so the data-migration
  # driver ships on every install (the system still needs an ODBC driver to
  # actually connect).
  "pyodbc>=5,<6",
  "python-bidi>=0.4",
  "requests>=2.32,<3",
  # Reads a barcode out of a PHOTOGRAPH, for the companion camera. The phone
  # decodes in the browser first (instant, no network), but that decoder is
  # jsQR: clean-image only, and QR only — so on an iPhone, which has no
  # BarcodeDetector, every EAN-13 and every slightly-blurred receipt QR failed.
  # This is the fallback that reads them. Ships manylinux/macOS wheels for
  # cp310-cp314 with no system libraries; apps.companion.decoding degrades to
  # "not found" if it is ever absent.
  "zxing-cpp>=2,<4",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-django>=4.9,<5",
  "ruff>=0.8,<1",
]
# Extra source-database drivers for the data-migration feature (apps.migration).
# Postgres (psycopg), SQLite (stdlib), and SQL Server (pyodbc) are in the base
# deps; only MongoDB is gated here. Install with
# `pip install pointy-backend[migration]` on deployments that migrate from Mongo.
migration = [
  "pymongo>=4,<5",
]

[tool.setuptools]
packages = [
  "pointy",
  "apps",
  "apps.core",
  "apps.core.management",
  "apps.core.management.commands",
  "apps.analytics",
  "apps.analytics.management",
  "apps.analytics.management.commands",
  "apps.analytics.migrations",
  "apps.catalog",
  "apps.catalog.management",
  "apps.catalog.management.commands",
  "apps.catalog.migrations",
  "apps.inventory",
  "apps.inventory.migrations",
  "apps.sales",
  "apps.sales.management",
  "apps.sales.management.commands",
  "apps.sales.migrations",
  "apps.fraud",
  "apps.fraud.migrations",
  "apps.customers",
  "apps.customers.migrations",
  "apps.purchasing",
  "apps.purchasing.migrations",
  "apps.discounts",
  "apps.discounts.migrations",
  "apps.payments",
  "apps.payments.migrations",
  "apps.printing",
  "apps.printing.migrations",
  "apps.reports",
  "apps.reports.migrations",
  "apps.attachments",
  "apps.attachments.migrations",
  "apps.attendance",
  "apps.attendance.migrations",
  "apps.price_checker",
  "apps.price_checker.management",
  "apps.price_checker.management.commands",
  "apps.price_checker.migrations",
  "apps.migration",
  "apps.migration.migrations",
  "apps.migration.transports",
  "apps.migration.connectors",
  "apps.migration.loaders",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pointy.settings"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
