[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pointy-backend"
version = "0.1.0"
description = "Django REST backend for Pointy POS."
requires-python = ">=3.12"
dependencies = [
  "arabic-reshaper>=3,<4",
  "celery[redis]>=5.4,<6",
  "django>=5.1,<6",
  "django-cors-headers>=4.4,<5",
  "django-environ>=0.11,<1",
  "django-filter>=24.3,<26",
  "django-redis>=5.4,<6",
  "djangorestframework>=3.15,<4",
  "drf-spectacular>=0.27,<1",
  "pillow>=10,<12",
  "psycopg[binary]>=3.2,<4",
  "python-bidi>=0.4",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-django>=4.9,<5",
  "ruff>=0.8,<1",
]
# Optional source-database drivers for the data-migration feature
# (apps.migration). Postgres (psycopg) ships in the base deps and SQLite is in
# the stdlib, so only the MSSQL and Mongo drivers are gated here. Install with
# `pip install pointy-backend[migration]` on deployments that need them.
migration = [
  "pyodbc>=5,<6",
  "pymongo>=4,<5",
]

[tool.setuptools]
packages = [
  "pointy",
  "apps",
  "apps.core",
  "apps.core.management",
  "apps.core.management.commands",
  "apps.analytics",
  "apps.analytics.migrations",
  "apps.catalog",
  "apps.catalog.management",
  "apps.catalog.management.commands",
  "apps.catalog.migrations",
  "apps.inventory",
  "apps.inventory.migrations",
  "apps.sales",
  "apps.sales.management",
  "apps.sales.management.commands",
  "apps.sales.migrations",
  "apps.fraud",
  "apps.fraud.migrations",
  "apps.customers",
  "apps.customers.migrations",
  "apps.purchasing",
  "apps.purchasing.migrations",
  "apps.discounts",
  "apps.discounts.migrations",
  "apps.payments",
  "apps.payments.migrations",
  "apps.printing",
  "apps.printing.migrations",
  "apps.reports",
  "apps.reports.migrations",
  "apps.attachments",
  "apps.attachments.migrations",
  "apps.attendance",
  "apps.attendance.migrations",
  "apps.price_checker",
  "apps.price_checker.management",
  "apps.price_checker.management.commands",
  "apps.price_checker.migrations",
  "apps.migration",
  "apps.migration.migrations",
  "apps.migration.transports",
  "apps.migration.connectors",
  "apps.migration.loaders",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pointy.settings"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
