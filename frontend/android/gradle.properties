# The Gradle daemon has to fit inside a GitHub-hosted runner: 2 vCPU / 7 GB RAM.
# -Xmx8G plus a 4G metaspace let the daemon grow past physical RAM while three
# gen_snapshot processes AOT-compile the fat APK's ABIs alongside it, and the
# kernel OOM-killer took the runner agent down with it — surfacing as "The
# runner has received a shutdown signal" and `assembleRelease failed with exit
# code 143` (SIGTERM), several minutes after Gradle's last log line. 3G is well
# above what this build actually needs.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# The Kotlin compile daemon is a separate JVM and defaults generously; cap it so
# the two daemons plus the Dart AOT compilers stay inside the same 7 GB.
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
