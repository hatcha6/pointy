name: pointy_frontend
description: "Flutter point-of-sale frontend for Daftar (دفتر)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  # compat/win8: lowered to Dart 3.3 (Flutter 3.19 — the last Flutter that runs
  # on Windows 7/8/8.1). See COMPAT_WIN8.md. Main pins ^3.10.7.
  sdk: '>=3.3.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  intl: any
  archive: ^4.0.9
  # compat/win8: fl_chart (needs Flutter 3.6) DROPPED — dashboard charts render
  # a placeholder on this cashier-only build.
  flutter_libserialport: ^0.6.0
  esc_pos_utils_plus: ^2.0.4
  image: ^4.3.0
  # compat/win8: flutter_bluetooth_classic_serial DROPPED — Android-only plugin
  # (no Windows impl), unused by a USB-printer till, and its Android plugin
  # definition trips Flutter 3.19's embedding-v2 check during the Windows build.
  # bluetooth_print_transport_io.dart is stubbed to the no-op transport.
  # compat/win8: 0.3.3 floors at Dart 3.4 — cap at the 0.3.2 line.
  multicast_dns: '>=0.3.2 <0.3.3'
  # compat/win8: 2.3.2+ floors at Dart 3.4 — cap at 2.3.1 (classic
  # getInstance() API only; no SharedPreferencesAsync/WithCache in use).
  shared_preferences: '>=2.2.0 <2.3.2'
  # ── compat/win8 ───────────────────────────────────────────────────────────
  # Kept but DOWNGRADED to the last Flutter-3.19-era line (each floored above
  # Dart 3.3 in a recent major). BEST-EFFORT — confirm with a Flutter 3.19
  # `pub get` (FVM or the compat CI); the transitive tree may force more pins.
  printing: '>=5.11.0 <5.13.0'       # main ^5.14.3 (needs Flutter 3.22)
  file_picker: '>=6.1.1 <7.0.0'      # main ^11.0.2 (needs Flutter 3.22)
  wakelock_plus: '>=1.2.5 <1.3.0'    # main ^1.3.3 (needs Dart 3.4)
  flutter_tts: '>=3.8.0 <4.0.0'      # main ^4.2.5 (needs Dart 3.4)
  # DROPPED on this build (needed API-break downgrades a cashier till never
  # uses): mobile_scanner (camera scan), record (AI voice), gpt_markdown (AI
  # markdown). See COMPAT_WIN8.md.
  # ──────────────────────────────────────────────────────────────────────────
  # compat/win8: pdf 3.12.0 requires vector_math ^2.2.0, but Flutter 3.19's
  # flutter_test pins vector_math 2.1.4 exactly — conflict. pdf 3.11.x uses
  # vector_math ^2.1.0 (admits 2.1.4). printing 5.12 only needs pdf ^3.10.0.
  pdf: '>=3.11.0 <3.12.0'
  # compat/win8: qr 3.0.2 floors at Dart 3.4 — 3.0.1 is the last 3.3-safe
  # release (same QrCode/QrImage API).
  qr: '>=3.0.0 <3.0.2'
  # compat/win8: http_parser 4.1.0 floors at Dart 3.4 — 4.0.2 keeps MediaType.
  http_parser: '>=4.0.0 <4.1.0'
  # compat/win8: `web` DROPPED — it was only used by the web-only PDF delivery
  # path (order_document_web_delivery_web.dart, now stubbed), its Dart-3.3 line
  # clashes with the Flutter SDK's own web pin, and this build never runs on web.
  usb_serial: ^0.5.2
  # compat/win8: image_picker 1.2.0 floors at Dart 3.6 — 1.1.2 is the last
  # 3.3-safe release (same ImagePicker/pickImage/XFile API).
  image_picker: '>=1.1.0 <1.2.0'
  # Open web-search source citations (http/https links in AI replies) externally.
  url_launcher: ^6.3.1
  # Client self-update: read the running app version + a temp dir for the download.
  package_info_plus: ^8.0.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  # compat/win8: ^6 needs Dart 3.8; 3.0.x is the flutter_lints line for 3.19.
  flutter_lints: ^3.0.0

  # Generates per-platform launcher/app icons from assets/branding/logo.png.
  # Run `flutter pub run flutter_launcher_icons` after changing the logo.
  flutter_launcher_icons: ^0.14.4

# App icon generation for all platforms. Source: assets/branding/logo.png.
flutter_launcher_icons:
  image_path: "assets/branding/logo.png"
  # Android: legacy icon + adaptive icon (logo on a white background).
  android: "ic_launcher"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/logo.png"
  # iOS / macOS require opaque icons; flatten transparency onto white.
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  macos:
    generate: true
    image_path: "assets/branding/logo.png"
  windows:
    generate: true
    image_path: "assets/branding/logo.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/branding/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

  # Also exposed as plain assets so PDF generation can read the raw font bytes
  # via rootBundle and hand them to a background isolate.
  assets:
    - assets/fonts/IBMPlexSansArabic-Regular.ttf
    - assets/fonts/IBMPlexSansArabic-Bold.ttf
    # Brand logo, shown in-app (e.g. the login screen) and used to generate
    # the per-platform launcher icons via flutter_launcher_icons.
    - assets/branding/logo.png

  # To add more assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
