<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>دفتر كروت — مفاهيم الشعار</title>
<style>
@font-face{font-family:Plex;src:url(../../frontend/assets/fonts/IBMPlexSansArabic-Bold.ttf);font-weight:700}
@font-face{font-family:Plex;src:url(../../frontend/assets/fonts/IBMPlexSansArabic-Medium.ttf);font-weight:500}
body{margin:0;background:#F4F7F6;font-family:Plex,sans-serif;color:#123;padding:32px}
h1{margin:0 0 24px;font-size:28px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}

.col h2{margin:0 0 16px;font-size:22px}
.big{width:100%;max-width:340px;display:block;margin:auto}
.sizes{display:flex;align-items:end;gap:18px;justify-content:center;margin:18px 0}
.sizes img:nth-child(1){width:96px}.sizes img:nth-child(2){width:60px}.sizes img:nth-child(3){width:40px}
.mono{filter:grayscale(1) contrast(9) brightness(1.1)}
.dark{background:#111816;border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;justify-content:center}
.lock{display:flex;align-items:center;gap:14px;justify-content:center;margin-top:16px}
.lock img{width:64px}.word{font-size:38px;font-weight:700;color:#0F6E69}.word b{color:#E9A030}
.dark .word{color:#E3F3F0}
