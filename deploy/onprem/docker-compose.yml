x-pointy-logging: &pointy-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in deploy/onprem/.env}"
  DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
  DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}"
  # On-prem LAN appliance: accept any private LAN IP as a Host (DHCP-friendly)
  # while still rejecting public hosts. Lets cashier tills connect to whatever
  # IP discovery hands them with no per-site configuration.
  POINTY_ALLOW_PRIVATE_HOSTS: "${POINTY_ALLOW_PRIVATE_HOSTS:-true}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
  CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
  DJANGO_SECURE_SSL_REDIRECT: "${DJANGO_SECURE_SSL_REDIRECT:-false}"
  DJANGO_SESSION_COOKIE_SECURE: "${DJANGO_SESSION_COOKIE_SECURE:-false}"
  DJANGO_CSRF_COOKIE_SECURE: "${DJANGO_CSRF_COOKIE_SECURE:-false}"
  DJANGO_SECURE_PROXY_SSL_HEADER: "${DJANGO_SECURE_PROXY_SSL_HEADER:-}"
  DJANGO_STATIC_ROOT: /var/lib/pointy/staticfiles
  DJANGO_MEDIA_ROOT: /var/lib/pointy/media
  DJANGO_CLIENTS_ROOT: /var/lib/pointy/clients
  DATABASE_URL: "${POINTY_DATABASE_URL:?Set POINTY_DATABASE_URL in deploy/onprem/.env}"
  DATABASE_CONN_MAX_AGE: "60"
  REDIS_URL: "${POINTY_REDIS_URL:-redis://redis:6379/0}"
  POINTY_ATTACHMENT_STORAGE_ROOT: /var/lib/pointy/media
  POINTY_BACKUP_ALLOWED_ROOTS: /var/lib/pointy/backups,/mnt/pointy-external
  POINTY_BACKUP_STAGING_ROOT: /tmp/pointy-backup-staging
  POINTY_BACKUP_RETENTION_COUNT: "14"
  POINTY_RELAY_CONTROL_URL: "${POINTY_RELAY_CONTROL_URL:?Set POINTY_RELAY_CONTROL_URL in deploy/onprem/.env}"
  POINTY_RELAY_PUBLIC_API_URL: "${POINTY_RELAY_PUBLIC_API_URL:?Set POINTY_RELAY_PUBLIC_API_URL in deploy/onprem/.env}"
  POINTY_RELAY_CONNECTOR_ADDR: "${POINTY_RELAY_CONNECTOR_ADDR:?Set POINTY_RELAY_CONNECTOR_ADDR in deploy/onprem/.env}"
  POINTY_RELAY_ENROLLMENT_TOKEN: "${POINTY_RELAY_ENROLLMENT_TOKEN:-}"
  POINTY_REQUIRE_LICENSE: "${POINTY_REQUIRE_LICENSE:-false}"
  POINTY_RELAY_CONNECTOR_SETUP_TOKEN: "${POINTY_RELAY_CONNECTOR_SETUP_TOKEN:?Set POINTY_RELAY_CONNECTOR_SETUP_TOKEN in deploy/onprem/.env}"
  POINTY_RELAY_CONNECTOR_TLS_SERVER_NAME: "${POINTY_RELAY_CONNECTOR_TLS_SERVER_NAME:-}"
  POINTY_RELAY_ALLOW_INSECURE_CONTROL: "${POINTY_RELAY_ALLOW_INSECURE_CONTROL:-false}"
  POINTY_DISCOVERY_ENABLED: "true"
  POINTY_DISCOVERY_PRIVATE_ONLY: "true"
  # UDP *broadcasts* never reach a container through a published port
  # (docker-proxy forwards unicast only), so the in-container UDP responder can
  # never hear a client probe here. discovery-responder.(py|ps1) runs on the
  # host instead — registered by register-autostart.(sh|ps1) — and answers on
  # udp/47777 with this backend's LAN URL. The HTTP discovery endpoint
  # (/api/discovery/service/) stays on and serves the full payload.
  POINTY_DISCOVERY_UDP_ENABLED: "false"
  POINTY_DISCOVERY_UDP_PORT: "47777"
  POINTY_DISCOVERY_API_PORT: "8000"
  # Leave empty: the backend auto-detects and advertises its own LAN IP to each
  # till that discovers it (per-interface, works offline). Only set it to force a
  # specific address, e.g. a reverse proxy or DNS name clients must use instead.
  POINTY_DISCOVERY_API_BASE_URL: "${POINTY_DISCOVERY_API_BASE_URL:-}"
  POINTY_DISCOVERY_TRUST_PROXY_HEADERS: "false"
  POINTY_IMAGE_SEARCH_PROVIDERS: "${POINTY_IMAGE_SEARCH_PROVIDERS:-}"
  POINTY_SERPER_API_KEY: "${POINTY_SERPER_API_KEY:-}"
  POINTY_SERPAPI_API_KEY: "${POINTY_SERPAPI_API_KEY:-}"

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: pointy
      POSTGRES_USER: pointy
      POSTGRES_PASSWORD: "${POINTY_POSTGRES_PASSWORD:?Set POINTY_POSTGRES_PASSWORD in deploy/onprem/.env}"
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=1000
    volumes:
      - pointy-postgres-data:/var/lib/postgresql/data
    mem_limit: "${POINTY_POSTGRES_MEM_LIMIT:-1g}"
    cpus: "${POINTY_POSTGRES_CPUS:-1.5}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s
    logging: *pointy-logging

  redis:
    image: redis:7-alpine
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - pointy-redis-data:/data
    mem_limit: "${POINTY_REDIS_MEM_LIMIT:-768m}"
    cpus: "${POINTY_REDIS_CPUS:-1}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    logging: *pointy-logging

  backend:
    image: "${POINTY_BACKEND_IMAGE:-pointy-backend:local}"
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    command: ["web"]
    restart: always
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: "${POINTY_BACKEND_MEM_LIMIT:-2g}"
    cpus: "${POINTY_BACKEND_CPUS:-2}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-environment
      POINTY_ASGI_WORKERS: "${POINTY_ASGI_WORKERS:-3}"
      POINTY_ASGI_KEEP_ALIVE: "${POINTY_ASGI_KEEP_ALIVE:-5}"
      POINTY_ASGI_GRACEFUL_TIMEOUT: "${POINTY_ASGI_GRACEFUL_TIMEOUT:-30}"
      POINTY_ASGI_MAX_REQUESTS: "${POINTY_ASGI_MAX_REQUESTS:-1000}"
      POINTY_ASGI_MAX_REQUESTS_JITTER: "${POINTY_ASGI_MAX_REQUESTS_JITTER:-100}"
      POINTY_ASGI_LIMIT_CONCURRENCY: "${POINTY_ASGI_LIMIT_CONCURRENCY:-}"
      POINTY_ASGI_PROXY_HEADERS: "${POINTY_ASGI_PROXY_HEADERS:-0}"
      POINTY_ASGI_FORWARDED_ALLOW_IPS: "${POINTY_ASGI_FORWARDED_ALLOW_IPS:-127.0.0.1}"
    ports:
      - "${POINTY_BACKEND_BIND:-0.0.0.0}:8000:8000"
    volumes:
      - pointy-media:/var/lib/pointy/media
      - pointy-static:/var/lib/pointy/staticfiles
      - pointy-backups:/var/lib/pointy/backups
      - pointy-clients:/var/lib/pointy/clients
      - pointy-backup-staging:/tmp/pointy-backup-staging
      - type: bind
        source: "${POINTY_BACKUP_DRIVE_1_SOURCE:-./external-backups/drive-1}"
        target: /mnt/pointy-external/drive-1
      - type: bind
        source: "${POINTY_BACKUP_DRIVE_2_SOURCE:-./external-backups/drive-2}"
        target: /mnt/pointy-external/drive-2
      - type: bind
        source: "${POINTY_BACKUP_DRIVE_3_SOURCE:-./external-backups/drive-3}"
        target: /mnt/pointy-external/drive-3
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test: ["CMD", "python", "/app/backend/docker/healthcheck.py", "http://127.0.0.1:8000/readyz/"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
    stop_grace_period: 45s
    logging: *pointy-logging

  celery-worker:
    image: "${POINTY_BACKEND_IMAGE:-pointy-backend:local}"
    command: ["worker"]
    restart: always
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: "${POINTY_WORKER_MEM_LIMIT:-1536m}"
    cpus: "${POINTY_WORKER_CPUS:-2}"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *backend-environment
      CELERY_WORKER_CONCURRENCY: "${CELERY_WORKER_CONCURRENCY:-2}"
      CELERY_LOG_LEVEL: "${CELERY_LOG_LEVEL:-info}"
    volumes:
      - pointy-media:/var/lib/pointy/media
      - pointy-backups:/var/lib/pointy/backups
      - pointy-backup-staging:/tmp/pointy-backup-staging
      - type: bind
        source: "${POINTY_BACKUP_DRIVE_1_SOURCE:-./external-backups/drive-1}"
        target: /mnt/pointy-external/drive-1
      - type: bind
        source: "${POINTY_BACKUP_DRIVE_2_SOURCE:-./external-backups/drive-2}"
        target: /mnt/pointy-external/drive-2
      - type: bind
        source: "${POINTY_BACKUP_DRIVE_3_SOURCE:-./external-backups/drive-3}"
        target: /mnt/pointy-external/drive-3
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test: ["CMD", "celery", "-A", "pointy", "inspect", "ping", "--timeout=5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 60s
    logging: *pointy-logging

  celery-beat:
    image: "${POINTY_BACKEND_IMAGE:-pointy-backend:local}"
    command: ["beat"]
    restart: always
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: "${POINTY_BEAT_MEM_LIMIT:-256m}"
    cpus: "${POINTY_BEAT_CPUS:-0.5}"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *backend-environment
      CELERY_LOG_LEVEL: "${CELERY_LOG_LEVEL:-info}"
    volumes:
      - pointy-celerybeat:/var/lib/pointy/celerybeat
      - pointy-backups:/var/lib/pointy/backups
      - pointy-backup-staging:/tmp/pointy-backup-staging
      - type: bind
        source: "${POINTY_BACKUP_DRIVE_1_SOURCE:-./external-backups/drive-1}"
        target: /mnt/pointy-external/drive-1
      - type: bind
        source: "${POINTY_BACKUP_DRIVE_2_SOURCE:-./external-backups/drive-2}"
        target: /mnt/pointy-external/drive-2
      - type: bind
        source: "${POINTY_BACKUP_DRIVE_3_SOURCE:-./external-backups/drive-3}"
        target: /mnt/pointy-external/drive-3
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    stop_grace_period: 45s
    logging: *pointy-logging

  connector:
    image: "${POINTY_RELAY_IMAGE:-pointy-relay:local}"
    build:
      context: ../..
      dockerfile: relay/Dockerfile
    command:
      - connector
      - --relay
      - "${POINTY_RELAY_CONNECTOR_ADDR:?Set POINTY_RELAY_CONNECTOR_ADDR in deploy/onprem/.env}"
      - --backend
      - http://backend:8000
    restart: always
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: "${POINTY_CONNECTOR_MEM_LIMIT:-128m}"
    cpus: "${POINTY_CONNECTOR_CPUS:-0.5}"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      POINTY_RELAY_CONNECTOR_SETUP_TOKEN: "${POINTY_RELAY_CONNECTOR_SETUP_TOKEN:?Set POINTY_RELAY_CONNECTOR_SETUP_TOKEN in deploy/onprem/.env}"
      POINTY_RELAY_CONNECTOR_STATE_FILE: /var/lib/pointy/relay-connector.json
      POINTY_RELAY_TLS_SERVER_NAME: "${POINTY_RELAY_CONNECTOR_TLS_SERVER_NAME:-}"
      POINTY_RELAY_ALLOW_INSECURE_CONNECTOR: "${POINTY_RELAY_ALLOW_INSECURE_CONNECTOR:-false}"
      POINTY_RELAY_CONNECTOR_REQUEST_TIMEOUT: "30s"
      POINTY_RELAY_CONNECTOR_MAX_CONCURRENT_REQUESTS: "64"
    volumes:
      - pointy-connector-state:/var/lib/pointy
    stop_grace_period: 30s
    logging: *pointy-logging

  # Browser front door: serves the Flutter web build and reverse-proxies /api,
  # /media, /static, /admin, /healthz, /readyz to the backend on the SAME origin
  # (no CORS, no server IP for the browser app). Native tills still hit the
  # backend directly on :8000 via discovery, so the web app is purely additive
  # and a web outage never affects the tills.
  web:
    image: "${POINTY_WEB_IMAGE:-pointy-web:local}"
    build:
      context: ../..
      dockerfile: deploy/onprem/web/Dockerfile
      args:
        FLUTTER_VERSION: "3.38.6"
    restart: always
    init: true
    # nginx keeps its default Linux capabilities on purpose: it needs SETUID/
    # SETGID to drop worker privileges and NET_BIND_SERVICE to bind :80. It is
    # still locked down with a read-only root filesystem, no privilege
    # escalation, tmpfs-only writable paths, and CPU/memory/PID caps.
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: "${POINTY_WEB_MEM_LIMIT:-128m}"
    cpus: "${POINTY_WEB_CPUS:-0.5}"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${POINTY_WEB_BIND:-0.0.0.0}:${POINTY_WEB_PORT:-80}:80"
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,size=8m
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz-web"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 15s
    logging: *pointy-logging

volumes:
  pointy-postgres-data:
  pointy-redis-data:
  pointy-media:
  pointy-static:
  pointy-backups:
  pointy-backup-staging:
  pointy-celerybeat:
  pointy-connector-state:
  pointy-clients:
