x-pointy-logging: &pointy-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in deploy/onprem/.env}"
  DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
  DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}"
  # On-prem LAN appliance: accept any private LAN IP as a Host (DHCP-friendly)
  # while still rejecting public hosts. Lets cashier tills connect to whatever
  # IP discovery hands them with no per-site configuration.
  POINTY_ALLOW_PRIVATE_HOSTS: "${POINTY_ALLOW_PRIVATE_HOSTS:-true}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
  CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
  DJANGO_SECURE_SSL_REDIRECT: "${DJANGO_SECURE_SSL_REDIRECT:-false}"
  DJANGO_SESSION_COOKIE_SECURE: "${DJANGO_SESSION_COOKIE_SECURE:-false}"
  DJANGO_CSRF_COOKIE_SECURE: "${DJANGO_CSRF_COOKIE_SECURE:-false}"
  DJANGO_SECURE_PROXY_SSL_HEADER: "${DJANGO_SECURE_PROXY_SSL_HEADER:-}"
  DJANGO_STATIC_ROOT: /var/lib/pointy/staticfiles
  DJANGO_MEDIA_ROOT: /var/lib/pointy/media
  DJANGO_CLIENTS_ROOT: /var/lib/pointy/clients
  DATABASE_URL: "${POINTY_DATABASE_URL:?Set POINTY_DATABASE_URL in deploy/onprem/.env}"
  # Pooler-bypassing URL used ONLY for schema migrations at startup (Django's
  # migrate takes a session-scoped advisory lock that transaction-pooled
  # PgBouncer cannot carry). Optional: if blank, migrations run over DATABASE_URL.
  POINTY_DATABASE_DIRECT_URL: "${POINTY_DATABASE_DIRECT_URL:-}"
  # Keep the client->PgBouncer connection warm. With PgBouncer in TRANSACTION
  # mode an idle client connection does NOT hold a Postgres backend (the server
  # conn returns to the pool after each transaction), so this is safe AND avoids a
  # reconnect + SCRAM-auth handshake on every request (0 here made search crawl).
  # It was Postgres-direct + CONN_MAX_AGE that piled connections to 100 — the
  # pooler, not this value, is what caps real backends now.
  DATABASE_CONN_MAX_AGE: "${DATABASE_CONN_MAX_AGE:-120}"
  REDIS_URL: "${POINTY_REDIS_URL:-redis://redis:6379/0}"
  # Redis caches of near-static DB state (seconds; 0 disables). Signal-driven
  # invalidation; TTLs only bound out-of-band edits (raw SQL in psql).
  POINTY_SHOP_SETTINGS_CACHE_TTL: "${POINTY_SHOP_SETTINGS_CACHE_TTL:-60}"
  POINTY_PERMISSION_CACHE_TTL: "${POINTY_PERMISSION_CACHE_TTL:-300}"
  POINTY_DISCOUNT_PREVIEW_CACHE_TTL: "${POINTY_DISCOUNT_PREVIEW_CACHE_TTL:-15}"
  POINTY_CATALOG_CACHE_ENABLED: "${POINTY_CATALOG_CACHE_ENABLED:-true}"
  POINTY_PRICE_LOOKUP_CACHE_TTL: "${POINTY_PRICE_LOOKUP_CACHE_TTL:-30}"
  POINTY_ATTACHMENT_STORAGE_ROOT: /var/lib/pointy/media
  POINTY_BACKUP_ALLOWED_ROOTS: /var/lib/pointy/backups,/mnt/pointy-external
  POINTY_BACKUP_STAGING_ROOT: /tmp/pointy-backup-staging
  POINTY_BACKUP_RETENTION_COUNT: "14"
  POINTY_RELAY_CONTROL_URL: "${POINTY_RELAY_CONTROL_URL:?Set POINTY_RELAY_CONTROL_URL in deploy/onprem/.env}"
  POINTY_RELAY_PUBLIC_API_URL: "${POINTY_RELAY_PUBLIC_API_URL:?Set POINTY_RELAY_PUBLIC_API_URL in deploy/onprem/.env}"
  POINTY_RELAY_CONNECTOR_ADDR: "${POINTY_RELAY_CONNECTOR_ADDR:?Set POINTY_RELAY_CONNECTOR_ADDR in deploy/onprem/.env}"
  POINTY_RELAY_ENROLLMENT_TOKEN: "${POINTY_RELAY_ENROLLMENT_TOKEN:-}"
  POINTY_REQUIRE_LICENSE: "${POINTY_REQUIRE_LICENSE:-false}"
  POINTY_RELAY_CONNECTOR_SETUP_TOKEN: "${POINTY_RELAY_CONNECTOR_SETUP_TOKEN:?Set POINTY_RELAY_CONNECTOR_SETUP_TOKEN in deploy/onprem/.env}"
  POINTY_RELAY_CONNECTOR_TLS_SERVER_NAME: "${POINTY_RELAY_CONNECTOR_TLS_SERVER_NAME:-}"
  POINTY_RELAY_ALLOW_INSECURE_CONTROL: "${POINTY_RELAY_ALLOW_INSECURE_CONTROL:-false}"
  POINTY_DISCOVERY_ENABLED: "true"
  POINTY_DISCOVERY_PRIVATE_ONLY: "true"
  # UDP *broadcasts* never reach a container through a published port
  # (docker-proxy forwards unicast only), so the in-container UDP responder can
  # never hear a client probe here. discovery-responder.(py|ps1) runs on the
  # host instead — registered by register-autostart.(sh|ps1) — and answers on
  # udp/47777 with this backend's LAN URL. The HTTP discovery endpoint
  # (/api/discovery/service/) stays on and serves the full payload.
  POINTY_DISCOVERY_UDP_ENABLED: "false"
  POINTY_DISCOVERY_UDP_PORT: "47777"
  POINTY_DISCOVERY_API_PORT: "8000"
  # Leave empty: the backend auto-detects and advertises its own LAN IP to each
  # till that discovers it (per-interface, works offline). Only set it to force a
  # specific address, e.g. a reverse proxy or DNS name clients must use instead.
  POINTY_DISCOVERY_API_BASE_URL: "${POINTY_DISCOVERY_API_BASE_URL:-}"
  POINTY_DISCOVERY_TRUST_PROXY_HEADERS: "false"
  POINTY_IMAGE_SEARCH_PROVIDERS: "${POINTY_IMAGE_SEARCH_PROVIDERS:-}"
  POINTY_SERPER_API_KEY: "${POINTY_SERPER_API_KEY:-}"
  POINTY_SERPAPI_API_KEY: "${POINTY_SERPAPI_API_KEY:-}"

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: pointy
      POSTGRES_USER: pointy
      POSTGRES_PASSWORD: "${POINTY_POSTGRES_PASSWORD:?Set POINTY_POSTGRES_PASSWORD in deploy/onprem/.env}"
    # Internals are env-tunable (defaults safe for a 1g Postgres; raise via .env on
    # a bigger host). max_connections is 60 now, not 100 — with PgBouncer in front
    # Postgres only ever sees the pool (~25-50 backends), so 60 is ample headroom
    # and 60 x ~9MB stays well inside a 1-2g limit (100 was the ceiling they hit).
    command:
      - postgres
      - -c
      - max_connections=${POINTY_PG_MAX_CONNECTIONS:-60}
      - -c
      - shared_buffers=${POINTY_PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POINTY_PG_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${POINTY_PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${POINTY_PG_MAINTENANCE_WORK_MEM:-64MB}
      # JIT off by default. Catalog search builds a large plan (many ranking
      # sub-queries) that trips PostgreSQL's JIT threshold; on a small on-prem box
      # JIT then spends ~90% of the query COMPILING the plan on every keystroke
      # (measured: 675ms JIT vs ~50ms of actual work). The query is cheap once JIT
      # is out of the way. Re-enable per host with POINTY_PG_JIT=on if ever needed.
      - -c
      - jit=${POINTY_PG_JIT:-off}
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=1000
    # Docker's default /dev/shm is 64MB; parallel queries under the bigger config
    # can exhaust it ("No space left on device"). Give it room.
    shm_size: "${POINTY_POSTGRES_SHM_SIZE:-256mb}"
    volumes:
      - pointy-postgres-data:/var/lib/postgresql/data
    mem_limit: "${POINTY_POSTGRES_MEM_LIMIT:-1g}"
    cpus: "${POINTY_POSTGRES_CPUS:-1.5}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s
    logging: *pointy-logging

  # Connection pooler (transaction mode). Multiplexes every app/worker/thread
  # connection onto a small fixed set of real Postgres backends, so the Postgres
  # connection count no longer scales with ASGI workers x threads x requests.
  # THIS is what prevents Postgres from ever hitting max_connections again.
  # No healthcheck on purpose: the image may lack pg_isready, and a failing check
  # would flap -> watchdog restart. The backend's own startup waiter
  # (docker/wait_for_services.py) already proves the pooled path serves queries
  # before the app boots, which is the real readiness gate.
  pgbouncer:
    image: "${POINTY_PGBOUNCER_IMAGE:-edoburu/pgbouncer:v1.23.1-p2}"
    restart: always
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: pointy
      DB_USER: pointy
      DB_PASSWORD: "${POINTY_POSTGRES_PASSWORD:?Set POINTY_POSTGRES_PASSWORD in deploy/onprem/.env}"
      # MUST be scram-sha-256 (or trust/plain), NOT md5: Postgres 17 stores the
      # role password as a SCRAM verifier, so PgBouncer cannot authenticate TO
      # Postgres with an md5 secret ("server login failed: wrong password type").
      # SCRAM's handshake cost is a non-issue because DATABASE_CONN_MAX_AGE keeps
      # client connections warm (the reconnect storm that made it costly was the
      # CONN_MAX_AGE=0 bug). Set POINTY_PGBOUNCER_AUTH_TYPE=trust to drop client
      # auth entirely (safe: internal Docker network, no published port).
      AUTH_TYPE: "${POINTY_PGBOUNCER_AUTH_TYPE:-scram-sha-256}"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "${POINTY_PGBOUNCER_MAX_CLIENT_CONN:-300}"
      DEFAULT_POOL_SIZE: "${POINTY_PGBOUNCER_DEFAULT_POOL_SIZE:-25}"
      MIN_POOL_SIZE: "${POINTY_PGBOUNCER_MIN_POOL_SIZE:-5}"
      RESERVE_POOL_SIZE: "${POINTY_PGBOUNCER_RESERVE_POOL_SIZE:-5}"
      RESERVE_POOL_TIMEOUT: "3"
      # Hard ceiling on real Postgres backends — keep below Postgres max_connections.
      MAX_DB_CONNECTIONS: "${POINTY_PGBOUNCER_MAX_DB_CONNECTIONS:-50}"
      SERVER_IDLE_TIMEOUT: "60"
      QUERY_WAIT_TIMEOUT: "30"
      # psycopg3 sends these startup params; PgBouncer must not reject them.
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
      # Transaction mode resets state per-transaction; no session reset query.
      SERVER_RESET_QUERY: ""
    mem_limit: "${POINTY_PGBOUNCER_MEM_LIMIT:-96m}"
    cpus: "${POINTY_PGBOUNCER_CPUS:-2}"
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    stop_grace_period: 20s
    logging: *pointy-logging

  redis:
    image: redis:7-alpine
    restart: always
    # Cache + Celery broker only — nothing here is authoritative (orders,
    # payments, refunds and cash movements are synchronous, atomic writes to
    # Postgres), so Redis runs purely in-memory: no AOF, no RDB, no data volume.
    # A persistence file is exactly what an unclean shutdown (power loss)
    # corrupts, after which redis-server refuses to start ("Bad file format
    # reading the append only file") and, because the app is gated on Redis
    # being healthy, blocks the entire POS from booting until the volume is
    # wiped by hand. With no persistence, Redis always comes back clean; a cold
    # cache refills from Postgres in seconds and the periodic Celery beat
    # re-covers any queued (non-financial) task lost on restart.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    mem_limit: "${POINTY_REDIS_MEM_LIMIT:-768m}"
    cpus: "${POINTY_REDIS_CPUS:-1}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    logging: *pointy-logging

  backend:
    image: "${POINTY_BACKEND_IMAGE:-pointy-backend:local}"
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    command: ["web"]
    restart: always
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: "${POINTY_BACKEND_MEM_LIMIT:-2g}"
    cpus: "${POINTY_BACKEND_CPUS:-2}"
    depends_on:
      # postgres kept explicit so the direct-URL migration step has it healthy;
      # pgbouncer only needs to have started (the app's own waiter confirms it
      # actually serves before proceeding).
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      <<: *backend-environment
      POINTY_ASGI_WORKERS: "${POINTY_ASGI_WORKERS:-3}"
      POINTY_ASGI_KEEP_ALIVE: "${POINTY_ASGI_KEEP_ALIVE:-5}"
      POINTY_ASGI_GRACEFUL_TIMEOUT: "${POINTY_ASGI_GRACEFUL_TIMEOUT:-30}"
      # Worker recycling defaults OFF: steady POS polling makes all workers hit
      # the limit near-simultaneously — a full API outage at fixed intervals.
      POINTY_ASGI_MAX_REQUESTS: "${POINTY_ASGI_MAX_REQUESTS:-0}"
      POINTY_ASGI_MAX_REQUESTS_JITTER: "${POINTY_ASGI_MAX_REQUESTS_JITTER:-0}"
      POINTY_ASGI_LIMIT_CONCURRENCY: "${POINTY_ASGI_LIMIT_CONCURRENCY:-}"
      POINTY_ASGI_PROXY_HEADERS: "${POINTY_ASGI_PROXY_HEADERS:-0}"
      POINTY_ASGI_FORWARDED_ALLOW_IPS: "${POINTY_ASGI_FORWARDED_ALLOW_IPS:-127.0.0.1}"
    ports:
      - "${POINTY_BACKEND_BIND:-0.0.0.0}:8000:8000"
    volumes:
      - pointy-media:/var/lib/pointy/media
      - pointy-static:/var/lib/pointy/staticfiles
      - pointy-backups:/var/lib/pointy/backups
      - pointy-clients:/var/lib/pointy/clients
      - pointy-backup-staging:/tmp/pointy-backup-staging
      - type: bind
        source: "${POINTY_BACKUP_DRIVE_1_SOURCE:-./external-backups/drive-1}"
        target: /mnt/pointy-external/drive-1
      - type: bind
        source: "${POINTY_BACKUP_DRIVE_2_SOURCE:-./external-backups/drive-2}"
        target: /mnt/pointy-external/drive-2
      - type: bind
        source: "${POINTY_BACKUP_DRIVE_3_SOURCE:-./external-backups/drive-3}"
        target: /mnt/pointy-external/drive-3
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test: ["CMD", "python", "/app/backend/docker/healthcheck.py", "http://127.0.0.1:8000/readyz/"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
    stop_grace_period: 45s
    logging: *pointy-logging

  celery-worker:
    image: "${POINTY_BACKEND_IMAGE:-pointy-backend:local}"
    command: ["worker"]
    restart: always
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: "${POINTY_WORKER_MEM_LIMIT:-1536m}"
    cpus: "${POINTY_WORKER_CPUS:-2}"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *backend-environment
      CELERY_WORKER_CONCURRENCY: "${CELERY_WORKER_CONCURRENCY:-2}"
      CELERY_LOG_LEVEL: "${CELERY_LOG_LEVEL:-info}"
    volumes:
      - pointy-media:/var/lib/pointy/media
      - pointy-backups:/var/lib/pointy/backups
      - pointy-backup-staging:/tmp/pointy-backup-staging
      - type: bind
        source: "${POINTY_BACKUP_DRIVE_1_SOURCE:-./external-backups/drive-1}"
        target: /mnt/pointy-external/drive-1
      - type: bind
        source: "${POINTY_BACKUP_DRIVE_2_SOURCE:-./external-backups/drive-2}"
        target: /mnt/pointy-external/drive-2
      - type: bind
        source: "${POINTY_BACKUP_DRIVE_3_SOURCE:-./external-backups/drive-3}"
        target: /mnt/pointy-external/drive-3
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test: ["CMD", "celery", "-A", "pointy", "inspect", "ping", "--timeout=5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 60s
    logging: *pointy-logging

  celery-beat:
    image: "${POINTY_BACKEND_IMAGE:-pointy-backend:local}"
    command: ["beat"]
    restart: always
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: "${POINTY_BEAT_MEM_LIMIT:-256m}"
    cpus: "${POINTY_BEAT_CPUS:-0.5}"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *backend-environment
      CELERY_LOG_LEVEL: "${CELERY_LOG_LEVEL:-info}"
    volumes:
      - pointy-celerybeat:/var/lib/pointy/celerybeat
      - pointy-backups:/var/lib/pointy/backups
      - pointy-backup-staging:/tmp/pointy-backup-staging
      - type: bind
        source: "${POINTY_BACKUP_DRIVE_1_SOURCE:-./external-backups/drive-1}"
        target: /mnt/pointy-external/drive-1
      - type: bind
        source: "${POINTY_BACKUP_DRIVE_2_SOURCE:-./external-backups/drive-2}"
        target: /mnt/pointy-external/drive-2
      - type: bind
        source: "${POINTY_BACKUP_DRIVE_3_SOURCE:-./external-backups/drive-3}"
        target: /mnt/pointy-external/drive-3
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    stop_grace_period: 45s
    logging: *pointy-logging

  connector:
    image: "${POINTY_RELAY_IMAGE:-pointy-relay:local}"
    build:
      context: ../..
      dockerfile: relay/Dockerfile
    command:
      - connector
      - --relay
      - "${POINTY_RELAY_CONNECTOR_ADDR:?Set POINTY_RELAY_CONNECTOR_ADDR in deploy/onprem/.env}"
      - --backend
      - http://backend:8000
    restart: always
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: "${POINTY_CONNECTOR_MEM_LIMIT:-128m}"
    cpus: "${POINTY_CONNECTOR_CPUS:-0.5}"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      POINTY_RELAY_CONNECTOR_SETUP_TOKEN: "${POINTY_RELAY_CONNECTOR_SETUP_TOKEN:?Set POINTY_RELAY_CONNECTOR_SETUP_TOKEN in deploy/onprem/.env}"
      POINTY_RELAY_CONNECTOR_STATE_FILE: /var/lib/pointy/relay-connector.json
      POINTY_RELAY_TLS_SERVER_NAME: "${POINTY_RELAY_CONNECTOR_TLS_SERVER_NAME:-}"
      POINTY_RELAY_ALLOW_INSECURE_CONNECTOR: "${POINTY_RELAY_ALLOW_INSECURE_CONNECTOR:-false}"
      POINTY_RELAY_CONNECTOR_REQUEST_TIMEOUT: "30s"
      POINTY_RELAY_CONNECTOR_MAX_CONCURRENT_REQUESTS: "64"
    volumes:
      - pointy-connector-state:/var/lib/pointy
    stop_grace_period: 30s
    logging: *pointy-logging

  # Browser front door: serves the Flutter web build and reverse-proxies /api,
  # /media, /static, /admin, /healthz, /readyz to the backend on the SAME origin
  # (no CORS, no server IP for the browser app). Native tills still hit the
  # backend directly on :8000 via discovery, so the web app is purely additive
  # and a web outage never affects the tills.
  web:
    image: "${POINTY_WEB_IMAGE:-pointy-web:local}"
    build:
      context: ../..
      dockerfile: deploy/onprem/web/Dockerfile
      args:
        FLUTTER_VERSION: "3.38.6"
    restart: always
    init: true
    # nginx keeps its default Linux capabilities on purpose: it needs SETUID/
    # SETGID to drop worker privileges and NET_BIND_SERVICE to bind :80. It is
    # still locked down with a read-only root filesystem, no privilege
    # escalation, tmpfs-only writable paths, and CPU/memory/PID caps.
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: "${POINTY_WEB_MEM_LIMIT:-128m}"
    cpus: "${POINTY_WEB_CPUS:-0.5}"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${POINTY_WEB_BIND:-0.0.0.0}:${POINTY_WEB_PORT:-80}:80"
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,size=8m
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz-web"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 15s
    logging: *pointy-logging

volumes:
  pointy-postgres-data:
  pointy-media:
  pointy-static:
  pointy-backups:
  pointy-backup-staging:
  pointy-celerybeat:
  pointy-connector-state:
  pointy-clients:
