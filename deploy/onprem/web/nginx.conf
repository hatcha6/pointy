# Pointy on-prem web front door.
#
# Serves the compiled Flutter web app and reverse-proxies the backend API on the
# SAME origin, so the browser app needs no CORS rules and no server IP — it just
# calls /api on whatever address the user opened. Native tills keep talking to
# the backend directly on :8000 via UDP discovery; this is the browser entry
# point that ties the two together.

server {
    listen 80;
    server_name _;

    # Product images, attachment uploads and backup restores can be large.
    client_max_body_size 100m;

    # Docker's embedded DNS, so the upstream re-resolves if its container is
    # recreated with a new IP — the proxy keeps working across restarts.
    resolver 127.0.0.11 valid=30s ipv6=off;
    # Through the LAN front door, not straight to the backend: `edge` is the
    # container that survives an update and flips to the new backend the moment
    # it is ready, so routing the browser app through it means a live update
    # never 502s the web UI either.
    set $pointy_backend "http://edge:8000";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Lightweight endpoint for the container healthcheck.
    location = /healthz-web {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Nothing behind this proxy is buffered.
    #
    # This used to be opt-in per location, and everything that streams had to
    # remember to opt in: the analytics export did, the AI assistant's SSE did
    # not. It only worked because Django sets `X-Accel-Buffering: no` on the
    # event stream — one header, in application code, standing between a
    # working chat and a spinner that never resolves. That is not a thing to
    # depend on, so the default is off here and streaming is the property of
    # the proxy rather than of each response.
    #
    # Buffering also costs more than latency on this container: the memory
    # buffers spill to proxy_temp, which is a 32MB tmpfs, so a large export or
    # upload dies with "no space left on device" instead of passing through.
    # Off means bytes move as the backend produces them and nothing touches
    # disk. Matches `edge`, which has been doing exactly this all along.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;

    # Long enough for a slow first byte — an export's first row after a big
    # filtered scan, or an AI turn thinking before its first token. The backend
    # sends an SSE ping as soon as a stream opens and between tool rounds, so a
    # connection that is genuinely dead still fails rather than sitting here.
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;

    # Backend-served paths -> Django / uvicorn.
    location /api/     { proxy_pass $pointy_backend; }
    location /media/   { proxy_pass $pointy_backend; }
    location /static/  { proxy_pass $pointy_backend; }
    location /admin/   { proxy_pass $pointy_backend; }
    location /healthz/ { proxy_pass $pointy_backend; }
    location /readyz/  { proxy_pass $pointy_backend; }

    # LAN client installers + download page (Django serves from the clients volume).
    location /clients/ { proxy_pass $pointy_backend; }

    # Flutter web SPA: serve the requested file, else fall back to the app shell.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Never cache the app shell, so a new build is picked up on reload. Its
    # assets are content-hashed and safe for the browser to cache.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }
}
