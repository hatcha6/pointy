# Pointy LAN front door (the ":8000" every till talks to).
#
# This tiny nginx owns the LAN port instead of the backend container, which is
# what makes a live update possible: a Docker container cannot change its image
# without being destroyed, and only one container can hold a host port — so as
# long as the backend itself owned :8000, every update was an outage for the
# shop. With the front door here, the updater can start the NEW backend
# alongside the old one, wait for it to pass /readyz, and then flip this proxy
# to it (rewrite active/upstream.conf + `nginx -s reload`). A reload is graceful:
# in-flight requests finish on the old worker, new ones land on the new backend,
# and no connection is ever refused. See update.sh.
#
# It is deliberately a plain, pinned nginx image with its config bind-mounted
# from ./edge: it must NOT change from release to release, or updating would
# mean recreating the very container that keeps the port alive.

# Pass WebSocket upgrades through untouched (uvicorn runs with --ws auto).
map $http_upgrade $pointy_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8000 default_server;
    server_name _;

    # Tills used to speak to uvicorn directly, which caps neither body size nor
    # request time. Keep it that way so putting a proxy in the path can never
    # reject an upload (backup restore, product images) that worked before.
    client_max_body_size 0;

    # Docker's embedded DNS, re-resolved as we go: the upstream is a variable,
    # so nginx looks it up per request instead of pinning the container IP it
    # saw at boot. A recreated backend is picked up without a reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Which backend container is live right now.
    #
    # The default is the managed `backend` service; a live update overrides it
    # by dropping a file into active/ on the host and reloading. The include is
    # a GLOB and comes second on purpose: a missing, empty or wiped-out
    # override directory is not an error, it just means "serve from the managed
    # backend" — the state a shop should always fall back to. The subdirectory
    # also keeps these server-scoped directives out of nginx's own
    # `include conf.d/*.conf`, which is evaluated in the http context.
    set $pointy_upstream      "http://backend:8000";
    set $pointy_upstream_name "backend";
    include /etc/nginx/conf.d/active/*.conf;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # This proxy IS the trust boundary (nothing else can reach the backend), so
    # OVERWRITE rather than append: a till cannot forge a client IP past it, and
    # uvicorn's --proxy-headers can safely restore the real peer address for
    # throttling, discovery and analytics.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $pointy_connection_upgrade;
    proxy_http_version 1.1;

    # Stream both directions. Buffering would break Server-Sent Events (the AI
    # assistant) and the streamed analytics export, and this container has a
    # read-only root filesystem with only a small tmpfs — a buffered large
    # upload or download would die on "no space left on device" instead of
    # simply passing through.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 5s;
    proxy_send_timeout 24h;
    proxy_read_timeout 24h;

    # Names the container that served the response, so the updater can PROVE a
    # flip landed instead of assuming the reload took effect.
    add_header X-Pointy-Upstream $pointy_upstream_name always;

    # The POS polls continuously; an access log line per request would be pure
    # churn on top of the backend's own request tracking. Comment this out when
    # diagnosing a LAN/till issue and reload.
    access_log off;

    # Liveness of the front door itself, answered without touching the backend.
    location = /healthz-edge {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass $pointy_upstream;
    }
}
