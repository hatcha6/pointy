# Pointy on-prem distro configuration. Baked into the image; WSL reads it on
# every distro start.

[boot]
# Run systemd as PID 1. Two things depend on it:
#   * the distro stays up after the last shell exits (it is a server), and
#   * register-autostart.sh's watchdog / update-agent timers have a supervisor.
systemd=true

[automount]
enabled=true
# 'metadata' gives files on C:/D: real POSIX ownership and permissions, which
# bind-mounting an external backup drive into a container needs.
options="metadata,umask=22,fmask=11"

[interop]
enabled=true
# Do NOT append the Windows PATH. On a machine that also has Docker Desktop,
# an appended PATH makes `docker` resolve to docker.exe and every deploy script
# quietly drives the wrong engine.
appendWindowsPath=false

[network]
generateResolvConf=true
hostname=pointy

[user]
default=root
