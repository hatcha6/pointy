# Temporary: rebuilds the v0.9.9 Linux client on older runners. Artifacts only.
name: Hotfix Linux deb
on:
  push:
    branches: [hotfix/linux-deb-0.9.9]
env:
  FLUTTER_VERSION: "3.47.6"
  FLUTTER_CHANNEL: "stable"
jobs:
  build-linux:
    name: Build Linux app
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Toolchain + GTK headers for `flutter build linux`. libgtk-3-dev also
      # provides gtk+-unix-print-3.0, required by the `printing` plugin.
      # GStreamer dev headers are required by `audioplayers_linux` (barcode
      # scan feedback chimes); at runtime the till needs the distro's
      # gstreamer runtime + good plugins (preinstalled on desktop distros).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # The 22.04 image preinstalls this; it conflicts with the libunwind-dev
          # that libgstreamer1.0-dev needs.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter pub get
        working-directory: frontend
        run: |
          flutter --version
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Generate localizations
        working-directory: frontend
        run: flutter gen-l10n

      - name: Build Linux release (x64)
        working-directory: frontend
        run: >
          flutter build linux --release
          --obfuscate
          --split-debug-info=build/symbols
          --build-name=0.9.9
          --build-number=132
          --dart-define=POINTY_VERSION=0.9.9

      # Obfuscation symbols: the only way to read a stack trace from a shop once
      # the binary is obfuscated. A PRIVATE Actions artifact, never a release
      # asset — publishing these undoes the obfuscation. A few MB, so the long
      # retention barely touches the storage quota.
      - name: Upload obfuscation symbols (linux)
        uses: actions/upload-artifact@v4
        with:
          name: pointy-linux-symbols-${{ matrix.os }}
          path: frontend/build/symbols/*
          if-no-files-found: error
          retention-days: 90

      # `flutter build linux --build-name` sets the CMake version but never
      # reaches version.json: Flutter's CMake backend (tool_backend.dart) does
      # not forward BuildName/BuildNumber to `flutter assemble`, so the bundle
      # keeps pubspec's 1.0.0+1. package_info_plus reads that file on Linux,
      # which made every Linux till report 1.0.0 and offer itself the same
      # update forever. Stamp it before both packages copy the bundle.
      - name: Stamp version.json (linux)
        shell: bash
        env:
          VERSION: 0.9.9
          BUILD_NUMBER: 132
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, os
          path = "frontend/build/linux/x64/release/bundle/data/flutter_assets/version.json"
          with open(path) as f:
              info = json.load(f)
          info["version"] = os.environ["VERSION"]
          info["build_number"] = os.environ["BUILD_NUMBER"]
          with open(path, "w") as f:
              json.dump(info, f)
          print(f"{path}: {info}")
          EOF

      - name: Package portable tar.gz
        shell: bash
        run: |
          set -euo pipefail
          NAME="pointy-0.9.9-linux-x64"
          mkdir -p dist
          cp -r frontend/build/linux/x64/release/bundle "${NAME}"
          # tar (not zip) so the executable bit on pointy_frontend survives.
          tar -czf "dist/${NAME}.tar.gz" "${NAME}"
          ls -lh dist

      # The installable counterpart of the Windows setup.exe: menu entry, icon
      # theme, /usr/bin launcher — the things an extracted folder and a
      # hand-made shortcut cannot give a Linux Mint till. The tar.gz stays
      # alongside it: it is what the app's own self-update swaps in, and what a
      # non-Debian distro gets.
      - name: Package .deb installer
        shell: bash
        run: bash frontend/linux/packaging/build-deb.sh "0.9.9"

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          ( cd dist && sha256sum ./*.tar.gz ./*.deb > SHA256SUMS-linux.txt )
          cat dist/SHA256SUMS-linux.txt
          ls -lh dist

      # Short retention — see the note on the Android upload. Consumed by
      # build-onprem (same run); also on the GitHub Release for real releases.
      - uses: actions/upload-artifact@v4
        with:
          name: pointy-linux-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
