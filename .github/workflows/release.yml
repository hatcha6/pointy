# Builds and publishes the Pointy release artifacts when a GitHub Release is
# published:
#   * build-android  — universal release APK for cashier tablets/phones
#   * build-windows  — portable x64 Windows app (VC++ runtime bundled) for till PCs
#   * build-linux    — portable x64 Linux app (.tar.gz) for Linux till PCs
#   * build-onprem   — fully offline Docker bundle (.zip) for the on-prem server
#
# Toolchain versions are pinned to what the repo is developed against
# (Flutter 3.38.6 / Dart 3.10.7, JDK 17, Go 1.25 + Python 3.12 via the Docker
# images). Trigger it by publishing a release (tag like `v1.2.3`), or run it
# manually from the Actions tab to produce test artifacts without a release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a manual test build (artifacts only, no release upload), e.g. 1.2.3"
        required: false
        default: "0.0.0-dev"

# Required so the build jobs can attach assets to the triggering GitHub Release.
permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.38.6"
  FLUTTER_CHANNEL: "stable"
  JAVA_VERSION: "17"
  POSTGRES_IMAGE: "postgres:17-alpine"
  REDIS_IMAGE: "redis:7-alpine"

jobs:
  # ---------------------------------------------------------------------------
  # Resolve a single version string + build number shared by every build job.
  # ---------------------------------------------------------------------------
  version:
    name: Resolve version
    # Ignore "-compat" releases (e.g. v0.2-compat): those are the Windows-8
    # legacy builds handled by release-compat.yml. Skipping this shared job
    # short-circuits every build job below (they all `needs: version`).
    # workflow_dispatch (manual test builds) is never affected.
    if: ${{ github.event_name != 'release' || !endsWith(github.event.release.tag_name, '-compat') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      build_number: ${{ steps.derive.outputs.build_number }}
      is_release: ${{ steps.derive.outputs.is_release }}
      tag: ${{ steps.derive.outputs.tag }}
    steps:
      - id: derive
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            IS_RELEASE=true
          else
            TAG="${{ github.event.inputs.version }}"
            IS_RELEASE=false
          fi
          VERSION="${TAG#v}"                # strip a leading "v" if present
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "build_number=${{ github.run_number }}"
            echo "is_release=${IS_RELEASE}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=${TAG} version=${VERSION} build=${{ github.run_number }} is_release=${IS_RELEASE}"

  # ---------------------------------------------------------------------------
  # Android — universal release APK (one file that runs on every ABI, minSdk 23).
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    needs: version
    runs-on: ubuntu-latest
    env:
      # Empty unless the repo has the signing secrets configured. When present we
      # sign with the real upload key; otherwise the build falls back to debug
      # signing (see frontend/android/app/build.gradle.kts).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Configure release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          echo "Release signing configured (real upload key)."

      - name: Flutter pub get
        working-directory: frontend
        run: |
          flutter --version
          flutter pub get

      - name: Generate localizations
        working-directory: frontend
        run: flutter gen-l10n

      - name: Build universal release APK
        working-directory: frontend
        run: >
          flutter build apk --release
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build_number }}

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp frontend/build/app/outputs/flutter-apk/app-release.apk \
             "dist/pointy-${{ needs.version.outputs.version }}-android-universal.apk"
          ( cd dist && sha256sum ./*.apk > SHA256SUMS-android.txt )
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: pointy-android
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: ${{ needs.version.outputs.is_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.version.outputs.tag }}" dist/* --clobber

  # ---------------------------------------------------------------------------
  # Windows — x64 build packaged as an Inno Setup installer (Start Menu + desktop
  # shortcuts, uninstaller) for easy setup, plus a portable ZIP for locked-down
  # deployments. The Visual C++ runtime DLLs are bundled in both so the app
  # launches on old/minimal PCs that never installed the VC++ Redistributable.
  # Authenticode signing is applied automatically when the signing secrets exist.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows app
    needs: version
    runs-on: windows-latest
    env:
      # Empty unless the repo has the signing secrets. When present, the app and
      # the installer are Authenticode-signed (no SmartScreen "unknown publisher"
      # warning); otherwise they ship unsigned and the build still succeeds.
      WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
      WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter pub get
        working-directory: frontend
        run: |
          flutter --version
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Generate localizations
        working-directory: frontend
        run: flutter gen-l10n

      - name: Build Windows release (x64)
        working-directory: frontend
        run: >
          flutter build windows --release
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build_number }}

      - name: Bundle VC++ runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Locate the Release output (build/windows/<arch>/runner/Release).
          $release = (Get-ChildItem "frontend/build/windows" -Recurse -Directory |
                      Where-Object { $_.Name -eq 'Release' -and $_.FullName -match 'runner' } |
                      Select-Object -First 1).FullName
          if (-not $release) { throw "Windows Release output not found." }
          Write-Host "Release output: $release"

          # Copy the app-local Visual C++ runtime so the app runs without the
          # VC++ Redistributable installed (key for old/minimal till PCs).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $crtDir = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
                    Sort-Object FullName | Select-Object -Last 1
          if (-not $crtDir) { throw "Could not locate the VC++ redistributable CRT directory." }
          Write-Host "Bundling VC++ runtime from: $($crtDir.FullName)"
          Copy-Item "$($crtDir.FullName)\*.dll" -Destination $release -Force

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Hand the Release path to later steps.
          "RELEASE_DIR=$release" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Prepare code signing
        if: ${{ env.WINDOWS_SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "pointy-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                       Sort-Object FullName | Select-Object -Last 1).FullName
          if (-not $signtool) { throw "signtool.exe not found in the Windows SDK." }
          "PFX_PATH=$pfx"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Code-sign the app
        if: ${{ env.WINDOWS_SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:SIGNTOOL" sign /f "$env:PFX_PATH" /p "$env:WINDOWS_SIGNING_CERT_PASSWORD" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "$env:RELEASE_DIR\pointy_frontend.exe"
          if ($LASTEXITCODE -ne 0) { throw "Signing the app failed ($LASTEXITCODE)." }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.version.outputs.version }}"
          Compress-Archive -Path "$env:RELEASE_DIR\*" -DestinationPath "dist/pointy-$version-windows-x64.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.version.outputs.version }}"
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $out = (Resolve-Path dist).Path
          & "$iscc" "/DAppVersion=$version" "/DSourceDir=$env:RELEASE_DIR" "/DOutputDir=$out" `
            "frontend\windows\installer\pointy.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed ($LASTEXITCODE)." }

      - name: Code-sign the installer
        if: ${{ env.WINDOWS_SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "dist\pointy-${{ needs.version.outputs.version }}-windows-x64-setup.exe"
          & "$env:SIGNTOOL" sign /f "$env:PFX_PATH" /p "$env:WINDOWS_SIGNING_CERT_PASSWORD" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "$setup"
          if ($LASTEXITCODE -ne 0) { throw "Signing the installer failed ($LASTEXITCODE)." }

      - name: Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name
          } | Out-File -Encoding ascii "dist/SHA256SUMS-windows.txt"
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: pointy-windows
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: ${{ needs.version.outputs.is_release == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist | ForEach-Object { $_.FullName }
          gh release upload "${{ needs.version.outputs.tag }}" $files --clobber

  # ---------------------------------------------------------------------------
  # Linux — x64 build packaged as a portable .tar.gz (extract and run
  # ./pointy_frontend) for Linux till PCs. Staged into the on-prem bundle's
  # clients/ dir like Android/Windows so the backend serves it on the LAN
  # download page and Linux tills self-update from it (in-app bundle swap,
  # see linux_self_update.dart).
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux app
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain + GTK headers for `flutter build linux`. libgtk-3-dev also
      # provides gtk+-unix-print-3.0, required by the `printing` plugin.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter pub get
        working-directory: frontend
        run: |
          flutter --version
          flutter config --enable-linux-desktop
          flutter pub get

      # flutter_bluetooth_classic_serial (1.3.2, latest) declares Linux support
      # but ships an example *app* in its linux/ dir instead of a plugin — no
      # <name>_plugin CMake target — so `flutter build linux` fails at CMake
      # configure. Strip the `linux:` platform from the cached package's
      # pubspec so the Flutter tool skips it on this platform. Safe at runtime:
      # BluetoothPrintTransport catches the missing plugin and simply offers no
      # Bluetooth printers on Linux (serial/USB/Wi-Fi printing still work).
      # A local Linux dev build needs this same tweak until upstream fixes it.
      - name: Work around broken Bluetooth plugin Linux support
        shell: bash
        run: |
          set -euo pipefail
          # Drop the two-line `linux:` platform block (linux: + pluginClass:)
          # from every cached copy of the package.
          found=0
          for pubspec in "$HOME"/.pub-cache/hosted/pub.dev/flutter_bluetooth_classic_serial-*/pubspec.yaml; do
            [ -f "$pubspec" ] || continue
            found=1
            python3 - "$pubspec" <<'EOF'
          import re, sys

          path = sys.argv[1]
          src = open(path).read()
          out, n = re.subn(r'(?m)^[ \t]+linux:\n[ \t]+pluginClass:[^\n]*\n', '', src)
          if n != 1:
              sys.exit(f"expected exactly 1 linux platform block, found {n} in {path}")
          open(path, 'w').write(out)
          print(f"Stripped Linux platform from {path}")
          EOF
          done
          [ "$found" = "1" ] || { echo "flutter_bluetooth_classic_serial not found in the pub cache" >&2; exit 1; }

      - name: Generate localizations
        working-directory: frontend
        run: flutter gen-l10n

      - name: Build Linux release (x64)
        working-directory: frontend
        run: >
          flutter build linux --release
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build_number }}

      - name: Package portable tar.gz
        shell: bash
        run: |
          set -euo pipefail
          NAME="pointy-${{ needs.version.outputs.version }}-linux-x64"
          mkdir -p dist
          cp -r frontend/build/linux/x64/release/bundle "${NAME}"
          # tar (not zip) so the executable bit on pointy_frontend survives.
          tar -czf "dist/${NAME}.tar.gz" "${NAME}"
          ( cd dist && sha256sum "${NAME}.tar.gz" > SHA256SUMS-linux.txt )
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: pointy-linux
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: ${{ needs.version.outputs.is_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.version.outputs.tag }}" dist/* --clobber

  # ---------------------------------------------------------------------------
  # On-prem server — build the backend + relay images, pull Postgres + Redis,
  # docker-save all four, and zip them together with the Compose file, env
  # template, installer scripts and docs. The result is a self-contained,
  # registry-free installation the customer site loads and runs.
  # ---------------------------------------------------------------------------
  build-onprem:
    name: Build on-prem bundle
    needs: [version, build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    env:
      # The backend Dockerfile uses a `# syntax=` directive, which requires
      # BuildKit (default on the runner, but set it explicitly to be safe).
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4

      # The client builds from the android/windows/linux jobs are bundled so a
      # new shop's backend can serve them on the LAN and the client apps can
      # self-update from it.
      - name: Download Android client
        uses: actions/download-artifact@v4
        with:
          name: pointy-android
          path: client-artifacts
      - name: Download Windows client
        uses: actions/download-artifact@v4
        with:
          name: pointy-windows
          path: client-artifacts
      - name: Download Linux client
        uses: actions/download-artifact@v4
        with:
          name: pointy-linux
          path: client-artifacts

      - name: Build backend image
        run: >
          docker build -f backend/Dockerfile
          --build-arg POINTY_VERSION=${{ needs.version.outputs.version }}
          -t "pointy-backend:${{ needs.version.outputs.version }}" .

      - name: Build relay image
        run: >
          docker build -f relay/Dockerfile
          --build-arg POINTY_VERSION=${{ needs.version.outputs.version }}
          -t "pointy-relay:${{ needs.version.outputs.version }}" .

      - name: Build web image (Flutter web + nginx)
        run: >
          docker build -f deploy/onprem/web/Dockerfile
          --build-arg FLUTTER_VERSION=${{ env.FLUTTER_VERSION }}
          -t "pointy-web:${{ needs.version.outputs.version }}" .

      - name: Pull database + cache images
        run: |
          docker pull "${POSTGRES_IMAGE}"
          docker pull "${REDIS_IMAGE}"

      - name: Stage on-prem bundle
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="pointy-onprem-${VERSION}"
          mkdir -p "${BUNDLE}/images" dist

          echo "==> Saving images for offline 'docker load'…"
          docker save "pointy-backend:${VERSION}" -o "${BUNDLE}/images/pointy-backend-${VERSION}.tar"
          docker save "pointy-relay:${VERSION}"   -o "${BUNDLE}/images/pointy-relay-${VERSION}.tar"
          docker save "pointy-web:${VERSION}"      -o "${BUNDLE}/images/pointy-web-${VERSION}.tar"
          docker save "${POSTGRES_IMAGE}"          -o "${BUNDLE}/images/postgres.tar"
          docker save "${REDIS_IMAGE}"             -o "${BUNDLE}/images/redis.tar"

          echo "==> Staging client installers (Android APK + Windows installer + Linux tar.gz)…"
          mkdir -p "${BUNDLE}/clients"
          apk="$(ls client-artifacts/pointy-*-android-universal.apk 2>/dev/null | head -1 || true)"
          win="$(ls client-artifacts/pointy-*-windows-x64-setup.exe 2>/dev/null | head -1 || true)"
          lin="$(ls client-artifacts/pointy-*-linux-x64.tar.gz 2>/dev/null | head -1 || true)"
          android_json="null"
          windows_json="null"
          linux_json="null"
          if [ -n "${apk}" ]; then
            cp "${apk}" "${BUNDLE}/clients/"
            f="$(basename "${apk}")"
            android_json="{\"file\":\"${f}\",\"sha256\":\"$(sha256sum "${apk}" | awk '{print $1}')\",\"size\":$(stat -c%s "${apk}")}"
          fi
          if [ -n "${win}" ]; then
            cp "${win}" "${BUNDLE}/clients/"
            f="$(basename "${win}")"
            windows_json="{\"file\":\"${f}\",\"sha256\":\"$(sha256sum "${win}" | awk '{print $1}')\",\"size\":$(stat -c%s "${win}")}"
          fi
          if [ -n "${lin}" ]; then
            cp "${lin}" "${BUNDLE}/clients/"
            f="$(basename "${lin}")"
            linux_json="{\"file\":\"${f}\",\"sha256\":\"$(sha256sum "${lin}" | awk '{print $1}')\",\"size\":$(stat -c%s "${lin}")}"
          fi
          printf '{"version":"%s","android":%s,"windows":%s,"linux":%s}\n' \
            "${VERSION}" "${android_json}" "${windows_json}" "${linux_json}" > "${BUNDLE}/clients/manifest.json"
          echo "Client manifest:"; cat "${BUNDLE}/clients/manifest.json"

          echo "==> Rendering offline Compose (drop source 'build:' sections, keep anchors)…"
          yq eval 'del(.services.backend.build) | del(.services.connector.build) | del(.services.web.build)' \
            deploy/onprem/docker-compose.yml | sed 's/!!merge //g' > "${BUNDLE}/docker-compose.yml"

          echo "==> Pinning the shipped image tags in the .env template…"
          sed -e "s|^POINTY_BACKEND_IMAGE=.*|POINTY_BACKEND_IMAGE=pointy-backend:${VERSION}|" \
              -e "s|^POINTY_RELAY_IMAGE=.*|POINTY_RELAY_IMAGE=pointy-relay:${VERSION}|" \
              -e "s|^POINTY_WEB_IMAGE=.*|POINTY_WEB_IMAGE=pointy-web:${VERSION}|" \
              deploy/onprem/.env.example > "${BUNDLE}/.env.example"

          cp deploy/onprem/install.sh deploy/onprem/install.ps1 \
             deploy/onprem/watchdog.sh deploy/onprem/watchdog.ps1 \
             deploy/onprem/register-autostart.sh deploy/onprem/register-autostart.ps1 \
             deploy/onprem/update-agent.sh deploy/onprem/update-agent.ps1 \
             deploy/onprem/update.sh deploy/onprem/update.ps1 \
             deploy/onprem/discovery-responder.py deploy/onprem/discovery-responder.ps1 \
             deploy/onprem/migrate-fahd.sh deploy/onprem/migrate-fahd.ps1 \
             deploy/onprem/INSTALL.md deploy/onprem/README.md "${BUNDLE}/"
          chmod +x "${BUNDLE}/install.sh" "${BUNDLE}/watchdog.sh" \
             "${BUNDLE}/register-autostart.sh" "${BUNDLE}/update-agent.sh" \
             "${BUNDLE}/update.sh" "${BUNDLE}/discovery-responder.py" \
             "${BUNDLE}/migrate-fahd.sh"
          echo "${VERSION}" > "${BUNDLE}/VERSION.txt"

          echo "==> Sanity-checking rendered Compose…"
          yq eval '.services | keys' "${BUNDLE}/docker-compose.yml"
          if grep -qE '^\s+build:' "${BUNDLE}/docker-compose.yml"; then
            echo "ERROR: build: section survived in the offline compose" >&2
            exit 1
          fi

          echo "==> Zipping bundle…"
          zip -r -q "dist/${BUNDLE}.zip" "${BUNDLE}"
          ( cd dist && sha256sum "${BUNDLE}.zip" > SHA256SUMS-onprem.txt )
          ls -lh dist "${BUNDLE}/images"

      - uses: actions/upload-artifact@v4
        with:
          name: pointy-onprem
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: ${{ needs.version.outputs.is_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.version.outputs.tag }}" dist/* --clobber

  # ---------------------------------------------------------------------------
  # Hosted relay — build the relay image and push it to GitHub Container
  # Registry (ghcr.io, private) so the company-run JPaaS environment can pull
  # and run it. This is the *central* relay that phones + on-prem connectors
  # reach; it is separate from the relay image baked into the offline on-prem
  # bundle above (that one stays registry-free for air-gapped sites).
  #
  # The image carries no secrets — the admin token, DB/Redis URLs and the
  # OpenRouter key are all injected as env vars on the JPaaS node
  # (POINTY_RELAY_PLATFORM=paas). Pull from JPaaS with a token that has
  # read:packages. Runs off `version` only, so it ships without waiting on the
  # Android/Windows client builds.
  # ---------------------------------------------------------------------------
  publish-relay:
    name: Publish relay image (ghcr)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push to ghcr.io
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name (ghcr requires lowercase)
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "ref=ghcr.io/${OWNER,,}/pointy-relay" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build relay image
        run: >
          docker build -f relay/Dockerfile
          --build-arg POINTY_VERSION=${{ needs.version.outputs.version }}
          -t "${{ steps.image.outputs.ref }}:${{ needs.version.outputs.version }}" .

      # Move :latest only for real releases so JPaaS can track a stable tag;
      # manual test builds (workflow_dispatch) publish just their version tag.
      - name: Tag :latest (releases only)
        if: ${{ needs.version.outputs.is_release == 'true' }}
        run: docker tag "${{ steps.image.outputs.ref }}:${{ needs.version.outputs.version }}" "${{ steps.image.outputs.ref }}:latest"

      - name: Push relay image
        run: docker push --all-tags "${{ steps.image.outputs.ref }}"
