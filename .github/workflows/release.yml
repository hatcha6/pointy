# Builds and publishes the Pointy release artifacts when a GitHub Release is
# published:
#   * build-android        — release APK (arm + arm64) for cashier tablets/phones
#   * build-windows        — Windows installer + portable zip for till PCs
#   * build-linux          — Linux .deb installer + portable .tar.gz for Linux till PCs
#   * build-onprem-images  — the Docker images, WSL rootfs and Compose the server runs
#   * build-onprem         — those plus the client installers, zipped: the offline bundle
#
# build-onprem-images deliberately depends on nothing but `version`, so the
# server side builds while the client apps are still compiling. Only the final
# assembly (which needs the installers) waits for them.
#
# Toolchain versions are pinned to what the repo is developed against
# (Flutter 3.38.6 / Dart 3.10.7, JDK 17, Go 1.25 + Python 3.12 via the Docker
# images). Trigger it by publishing a release (tag like `v1.2.3`), or run it
# manually from the Actions tab to produce test artifacts without a release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a manual test build (artifacts only, no release upload), e.g. 1.2.3"
        required: false
        default: "0.0.0-dev"
      compat_tag:
        description: "Windows 8 build to bundle, e.g. v0.4.6-compat (blank = the newest published -compat release)"
        required: false
        default: ""

# Required so the build jobs can attach assets to the triggering GitHub Release.
permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.38.6"
  # The WSL installer bundled into the on-prem zip, so a Windows shop can be
  # installed with no internet and no Microsoft Store. TAG is the microsoft/WSL
  # release tag; ASSET is the file name on that release (Microsoft appends a
  # fourth version component to the asset, so it is NOT derivable from the tag).
  # Bump both together and check the asset name on the release page.
  WSL_MSI_TAG: "2.3.26"
  WSL_MSI_ASSET: "wsl.2.3.26.0.x64.msi"
  FLUTTER_CHANNEL: "stable"
  JAVA_VERSION: "17"
  POSTGRES_IMAGE: "postgres:17-alpine"
  REDIS_IMAGE: "redis:7-alpine"
  # Keep in lockstep with the pgbouncer service default in deploy/onprem/docker-compose.yml.
  PGBOUNCER_IMAGE: "edoburu/pgbouncer:v1.23.1-p2"
  # The LAN front door. Its tag is bumped BY HAND (and in the compose default),
  # never per release: shops keep this container through every application
  # update, and re-tagging it per version would make each update recreate the
  # one thing holding the till port open. Bump it only when
  # deploy/onprem/edge/ changes, and expect it to apply at the next full restart.
  EDGE_IMAGE: "pointy-edge:1"

jobs:
  # ---------------------------------------------------------------------------
  # Resolve a single version string + build number shared by every build job.
  # ---------------------------------------------------------------------------
  version:
    name: Resolve version
    # Ignore "-compat" releases (e.g. v0.2-compat): those are the Windows-8
    # legacy builds handled by release-compat.yml. Skipping this shared job
    # short-circuits every build job below (they all `needs: version`).
    # workflow_dispatch (manual test builds) is never affected.
    if: ${{ github.event_name != 'release' || !endsWith(github.event.release.tag_name, '-compat') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      build_number: ${{ steps.derive.outputs.build_number }}
      is_release: ${{ steps.derive.outputs.is_release }}
      tag: ${{ steps.derive.outputs.tag }}
    steps:
      - id: derive
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            IS_RELEASE=true
          else
            TAG="${{ github.event.inputs.version }}"
            IS_RELEASE=false
          fi
          VERSION="${TAG#v}"                # strip a leading "v" if present
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "build_number=${{ github.run_number }}"
            echo "is_release=${IS_RELEASE}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=${TAG} version=${VERSION} build=${{ github.run_number }} is_release=${IS_RELEASE}"

  # ---------------------------------------------------------------------------
  # Android — one release APK for every Android till we sell to (minSdk 23),
  # carrying both ARM ABIs. x86_64 is deliberately excluded: no shipping cashier
  # tablet or phone uses it (it means Chromebooks, Android-x86 mini PCs and
  # Intel-host emulators). What that actually bought, measured on v0.5.0: the
  # APK went 120.4 MB -> 79.5 MB, which is what every till pulls over the shop's
  # own line on first install and on each self-update. It bought almost NO build
  # time (15.5 -> 14.9 min): whatever this job spends 15 minutes on, it is not
  # the third ABI's AOT compile. Do not cite speed as the reason.
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    needs: version
    runs-on: ubuntu-latest
    # The APK takes ~15 min. A runner that gets OOM-killed mid-Gradle goes
    # silent rather than failing, so cap it well short of the 6h default.
    timeout-minutes: 40
    env:
      # Empty unless the repo has the signing secrets configured. When present we
      # sign with the real upload key; otherwise the build falls back to debug
      # signing (see frontend/android/app/build.gradle.kts).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Configure release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          echo "Release signing configured (real upload key)."

      - name: Flutter pub get
        working-directory: frontend
        run: |
          flutter --version
          flutter pub get

      - name: Generate localizations
        working-directory: frontend
        run: flutter gen-l10n

      - name: Build universal release APK
        working-directory: frontend
        run: >
          flutter build apk --release
          --target-platform android-arm,android-arm64
          --obfuscate
          --split-debug-info=build/symbols
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build_number }}
          --dart-define=POINTY_VERSION=${{ needs.version.outputs.version }}

      # Obfuscation symbols: the only way to read a stack trace from a shop once
      # the binary is obfuscated. A PRIVATE Actions artifact, never a release
      # asset — publishing these undoes the obfuscation. A few MB, so the long
      # retention barely touches the storage quota.
      - name: Upload obfuscation symbols (android)
        uses: actions/upload-artifact@v4
        with:
          name: pointy-android-symbols
          path: frontend/build/symbols/*
          if-no-files-found: error
          retention-days: 90

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp frontend/build/app/outputs/flutter-apk/app-release.apk \
             "dist/pointy-${{ needs.version.outputs.version }}-android-universal.apk"
          ( cd dist && sha256sum ./*.apk > SHA256SUMS-android.txt )
          ls -lh dist

      # Short retention: this artifact only needs to survive long enough for the
      # build-onprem job (same run) to download it, and — for releases — the APK
      # is also attached to the GitHub Release, which does NOT count against the
      # Actions artifact storage quota. 90-day default retention was exhausting
      # the quota ("Artifact storage quota has been hit").
      - uses: actions/upload-artifact@v4
        with:
          name: pointy-android
          path: dist/*
          if-no-files-found: error
          retention-days: 1

      - name: Attach to release
        if: ${{ needs.version.outputs.is_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.version.outputs.tag }}" dist/* --clobber

  # ---------------------------------------------------------------------------
  # Windows — x64 build packaged as an Inno Setup installer (Start Menu + desktop
  # shortcuts, uninstaller) for easy setup, plus a portable ZIP for locked-down
  # deployments. The Visual C++ runtime DLLs are bundled in both so the app
  # launches on old/minimal PCs that never installed the VC++ Redistributable.
  # Authenticode signing is applied automatically when the signing secrets exist.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows app
    needs: version
    runs-on: windows-latest
    env:
      # Empty unless the repo has the signing secrets. When present, the app and
      # the installer are Authenticode-signed (no SmartScreen "unknown publisher"
      # warning); otherwise they ship unsigned and the build still succeeds.
      WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
      WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter pub get
        working-directory: frontend
        run: |
          flutter --version
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Generate localizations
        working-directory: frontend
        run: flutter gen-l10n

      - name: Build Windows release (x64)
        working-directory: frontend
        run: >
          flutter build windows --release
          --obfuscate
          --split-debug-info=build/symbols
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build_number }}
          --dart-define=POINTY_VERSION=${{ needs.version.outputs.version }}

      # Obfuscation symbols: the only way to read a stack trace from a shop once
      # the binary is obfuscated. A PRIVATE Actions artifact, never a release
      # asset — publishing these undoes the obfuscation. A few MB, so the long
      # retention barely touches the storage quota.
      - name: Upload obfuscation symbols (windows)
        uses: actions/upload-artifact@v4
        with:
          name: pointy-windows-symbols
          path: frontend/build/symbols/*
          if-no-files-found: error
          retention-days: 90

      - name: Bundle VC++ runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Locate the Release output (build/windows/<arch>/runner/Release).
          $release = (Get-ChildItem "frontend/build/windows" -Recurse -Directory |
                      Where-Object { $_.Name -eq 'Release' -and $_.FullName -match 'runner' } |
                      Select-Object -First 1).FullName
          if (-not $release) { throw "Windows Release output not found." }
          Write-Host "Release output: $release"

          # Copy the app-local Visual C++ runtime so the app runs without the
          # VC++ Redistributable installed (key for old/minimal till PCs).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $crtDir = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
                    Sort-Object FullName | Select-Object -Last 1
          if (-not $crtDir) { throw "Could not locate the VC++ redistributable CRT directory." }
          Write-Host "Bundling VC++ runtime from: $($crtDir.FullName)"
          Copy-Item "$($crtDir.FullName)\*.dll" -Destination $release -Force

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Hand the Release path to later steps.
          "RELEASE_DIR=$release" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Prepare code signing
        if: ${{ env.WINDOWS_SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "pointy-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                       Sort-Object FullName | Select-Object -Last 1).FullName
          if (-not $signtool) { throw "signtool.exe not found in the Windows SDK." }
          "PFX_PATH=$pfx"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Code-sign the app
        if: ${{ env.WINDOWS_SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:SIGNTOOL" sign /f "$env:PFX_PATH" /p "$env:WINDOWS_SIGNING_CERT_PASSWORD" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "$env:RELEASE_DIR\pointy_frontend.exe"
          if ($LASTEXITCODE -ne 0) { throw "Signing the app failed ($LASTEXITCODE)." }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.version.outputs.version }}"
          Compress-Archive -Path "$env:RELEASE_DIR\*" -DestinationPath "dist/pointy-$version-windows-x64.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.version.outputs.version }}"
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $out = (Resolve-Path dist).Path
          & "$iscc" "/DAppVersion=$version" "/DSourceDir=$env:RELEASE_DIR" "/DOutputDir=$out" `
            "frontend\windows\installer\pointy.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed ($LASTEXITCODE)." }

      - name: Code-sign the installer
        if: ${{ env.WINDOWS_SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "dist\pointy-${{ needs.version.outputs.version }}-windows-x64-setup.exe"
          & "$env:SIGNTOOL" sign /f "$env:PFX_PATH" /p "$env:WINDOWS_SIGNING_CERT_PASSWORD" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "$setup"
          if ($LASTEXITCODE -ne 0) { throw "Signing the installer failed ($LASTEXITCODE)." }

      - name: Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name
          } | Out-File -Encoding ascii "dist/SHA256SUMS-windows.txt"
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      # Short retention — see the note on the Android upload. Consumed by
      # build-onprem (same run); also on the GitHub Release for real releases.
      - uses: actions/upload-artifact@v4
        with:
          name: pointy-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 1

      - name: Attach to release
        if: ${{ needs.version.outputs.is_release == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist | ForEach-Object { $_.FullName }
          gh release upload "${{ needs.version.outputs.tag }}" $files --clobber

  # ---------------------------------------------------------------------------
  # Linux — x64 build packaged as a portable .tar.gz (extract and run
  # ./pointy_frontend) for Linux till PCs. Staged into the on-prem bundle's
  # clients/ dir like Android/Windows so the backend serves it on the LAN
  # download page and Linux tills self-update from it (in-app bundle swap,
  # see linux_self_update.dart).
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux app
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain + GTK headers for `flutter build linux`. libgtk-3-dev also
      # provides gtk+-unix-print-3.0, required by the `printing` plugin.
      # GStreamer dev headers are required by `audioplayers_linux` (barcode
      # scan feedback chimes); at runtime the till needs the distro's
      # gstreamer runtime + good plugins (preinstalled on desktop distros).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter pub get
        working-directory: frontend
        run: |
          flutter --version
          flutter config --enable-linux-desktop
          flutter pub get

      # flutter_bluetooth_classic_serial (1.3.2, latest) declares Linux support
      # but ships an example *app* in its linux/ dir instead of a plugin — no
      # <name>_plugin CMake target — so `flutter build linux` fails at CMake
      # configure. Strip the `linux:` platform from the cached package's
      # pubspec so the Flutter tool skips it on this platform. Safe at runtime:
      # BluetoothPrintTransport catches the missing plugin and simply offers no
      # Bluetooth printers on Linux (serial/USB/Wi-Fi printing still work).
      # A local Linux dev build needs this same tweak until upstream fixes it.
      - name: Work around broken Bluetooth plugin Linux support
        shell: bash
        run: |
          set -euo pipefail
          # Drop the two-line `linux:` platform block (linux: + pluginClass:)
          # from every cached copy of the package.
          found=0
          for pubspec in "$HOME"/.pub-cache/hosted/pub.dev/flutter_bluetooth_classic_serial-*/pubspec.yaml; do
            [ -f "$pubspec" ] || continue
            found=1
            python3 - "$pubspec" <<'EOF'
          import re, sys

          path = sys.argv[1]
          src = open(path).read()
          out, n = re.subn(r'(?m)^[ \t]+linux:\n[ \t]+pluginClass:[^\n]*\n', '', src)
          if n:
              open(path, 'w').write(out)
          # Idempotent: the pub cache is restored across CI runs (flutter-action
          # cache: true), so an earlier run may already have stripped this
          # (n == 0). "Already gone" is the desired end state -- only a
          # still-present linux platform block is a real error, which would mean
          # the package's pubspec layout changed and this regex no longer matches.
          if re.search(r'(?m)^[ \t]+linux:[ \t]*\n', out):
              sys.exit(f"linux platform block still present in {path}; package layout changed -- update this workaround")
          print(f"Linux platform stripped or already absent (removed {n}) from {path}")
          EOF
          done
          [ "$found" = "1" ] || { echo "flutter_bluetooth_classic_serial not found in the pub cache" >&2; exit 1; }

      - name: Generate localizations
        working-directory: frontend
        run: flutter gen-l10n

      - name: Build Linux release (x64)
        working-directory: frontend
        run: >
          flutter build linux --release
          --obfuscate
          --split-debug-info=build/symbols
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build_number }}
          --dart-define=POINTY_VERSION=${{ needs.version.outputs.version }}

      # Obfuscation symbols: the only way to read a stack trace from a shop once
      # the binary is obfuscated. A PRIVATE Actions artifact, never a release
      # asset — publishing these undoes the obfuscation. A few MB, so the long
      # retention barely touches the storage quota.
      - name: Upload obfuscation symbols (linux)
        uses: actions/upload-artifact@v4
        with:
          name: pointy-linux-symbols
          path: frontend/build/symbols/*
          if-no-files-found: error
          retention-days: 90

      - name: Package portable tar.gz
        shell: bash
        run: |
          set -euo pipefail
          NAME="pointy-${{ needs.version.outputs.version }}-linux-x64"
          mkdir -p dist
          cp -r frontend/build/linux/x64/release/bundle "${NAME}"
          # tar (not zip) so the executable bit on pointy_frontend survives.
          tar -czf "dist/${NAME}.tar.gz" "${NAME}"
          ls -lh dist

      # The installable counterpart of the Windows setup.exe: menu entry, icon
      # theme, /usr/bin launcher — the things an extracted folder and a
      # hand-made shortcut cannot give a Linux Mint till. The tar.gz stays
      # alongside it: it is what the app's own self-update swaps in, and what a
      # non-Debian distro gets.
      - name: Package .deb installer
        shell: bash
        run: bash frontend/linux/packaging/build-deb.sh "${{ needs.version.outputs.version }}"

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          ( cd dist && sha256sum ./*.tar.gz ./*.deb > SHA256SUMS-linux.txt )
          cat dist/SHA256SUMS-linux.txt
          ls -lh dist

      # Short retention — see the note on the Android upload. Consumed by
      # build-onprem (same run); also on the GitHub Release for real releases.
      - uses: actions/upload-artifact@v4
        with:
          name: pointy-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 1

      - name: Attach to release
        if: ${{ needs.version.outputs.is_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.version.outputs.tag }}" dist/* --clobber

  # ---------------------------------------------------------------------------
  # On-prem server, part 1 — build the backend/relay/web/edge images, pull
  # Postgres + Redis + PgBouncer, build the WSL distro, and zip all of it with
  # the Compose file, env template, installer scripts and docs.
  #
  # This is everything the server side of a shop needs and nothing that depends
  # on a client build, so it hangs off `version` alone and runs ALONGSIDE the
  # Android/Windows/Linux jobs instead of after them. That is what keeps the
  # release wall-clock near the longest client build rather than the sum of the
  # two halves. What it uploads is the finished bundle minus clients/;
  # build-onprem drops those in and signs the result.
  # ---------------------------------------------------------------------------
  build-onprem-images:
    name: Build on-prem images
    needs: version
    runs-on: ubuntu-latest
    env:
      # The backend Dockerfile uses a `# syntax=` directive, which requires
      # BuildKit (default on the runner, but set it explicitly to be safe).
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4

      # SEQUENTIAL ON PURPOSE, and the measurement is the reason. Backgrounding
      # the web image and the WSL rootfs behind the small builds looked free —
      # both spend much of their life downloading — but a GitHub runner has 2
      # vCPUs and every one of these saturates them: a Flutter web compile, a
      # Cython backend compile, and gzip -9 over a 1.5 GB rootfs. Run together
      # they took 27.7 min on v0.5.0; run in series they take about 8. The
      # parallelism that pays here is the JOB split, not this. Separate steps
      # also keep the per-step timings that made the regression visible.
      - name: Build backend image
        run: >
          docker build -f backend/Dockerfile
          --build-arg POINTY_VERSION=${{ needs.version.outputs.version }}
          -t "pointy-backend:${{ needs.version.outputs.version }}" .

      - name: Build relay image
        run: >
          docker build -f relay/Dockerfile
          --build-arg POINTY_VERSION=${{ needs.version.outputs.version }}
          -t "pointy-relay:${{ needs.version.outputs.version }}" .

      - name: Build LAN front-door image (nginx + flip config)
        run: >
          docker build -f deploy/onprem/edge/Dockerfile
          -t "${EDGE_IMAGE}" .

      - name: Build web image (Flutter web + nginx)
        run: >
          docker build -f deploy/onprem/web/Dockerfile
          --build-arg FLUTTER_VERSION=${{ env.FLUTTER_VERSION }}
          -t "pointy-web:${{ needs.version.outputs.version }}" .

      - name: Pull database + cache images
        run: |
          docker pull "${POSTGRES_IMAGE}"
          docker pull "${REDIS_IMAGE}"
          docker pull "${PGBOUNCER_IMAGE}"

      # The Windows install path is "WSL2 + this pre-baked distro". Building it
      # here rather than on the shop's PC is what keeps an on-prem install fully
      # offline: install.sh's Docker bootstrap fetches get.docker.com, which a
      # shop behind a dead line can never reach.
      - name: Build the WSL distro rootfs
        run: |
          mkdir -p wsl-rootfs
          bash deploy/onprem/wsl/build-rootfs.sh wsl-rootfs/pointy-wsl-rootfs.tar.gz

      # Bundling the WSL MSI lets bootstrap-wsl.ps1 install WSL on a machine with
      # no internet and no Microsoft Store (routinely stripped from POS images).
      # Best-effort: if the download fails the bundle still installs on any host
      # that already has a modern wsl.exe.
      - name: Fetch the WSL installer MSI
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p wsl-msi
          curl -fsSL -o wsl-msi/wsl.msi \
            "https://github.com/microsoft/WSL/releases/download/${WSL_MSI_TAG}/${WSL_MSI_ASSET}"
          ls -lh wsl-msi

      - name: Stage the server half of the bundle
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="pointy-onprem-${VERSION}"
          mkdir -p "${BUNDLE}/images" dist

          echo "==> Saving images for offline 'docker load'…"
          docker save "pointy-backend:${VERSION}" -o "${BUNDLE}/images/pointy-backend-${VERSION}.tar"
          docker save "pointy-relay:${VERSION}"   -o "${BUNDLE}/images/pointy-relay-${VERSION}.tar"
          docker save "pointy-web:${VERSION}"      -o "${BUNDLE}/images/pointy-web-${VERSION}.tar"
          docker save "${POSTGRES_IMAGE}"          -o "${BUNDLE}/images/postgres.tar"
          docker save "${REDIS_IMAGE}"             -o "${BUNDLE}/images/redis.tar"
          docker save "${PGBOUNCER_IMAGE}"         -o "${BUNDLE}/images/pgbouncer.tar"
          # Named pointy-edge*.tar so the live updater recognises it as
          # infrastructure and does NOT load it under a trading shop.
          docker save "${EDGE_IMAGE}"              -o "${BUNDLE}/images/pointy-edge.tar"

          echo "==> Rendering offline Compose (drop source 'build:' sections, keep anchors)…"
          yq eval 'del(.services.backend.build) | del(.services.connector.build) | del(.services.web.build) | del(.services.edge.build)' \
            deploy/onprem/docker-compose.yml | sed 's/!!merge //g' > "${BUNDLE}/docker-compose.yml"

          echo "==> Pinning the shipped image tags in the .env template…"
          sed -e "s|^POINTY_BACKEND_IMAGE=.*|POINTY_BACKEND_IMAGE=pointy-backend:${VERSION}|" \
              -e "s|^POINTY_RELAY_IMAGE=.*|POINTY_RELAY_IMAGE=pointy-relay:${VERSION}|" \
              -e "s|^POINTY_WEB_IMAGE=.*|POINTY_WEB_IMAGE=pointy-web:${VERSION}|" \
              -e "s|^POINTY_EDGE_IMAGE=.*|POINTY_EDGE_IMAGE=${EDGE_IMAGE}|" \
              deploy/onprem/.env.example > "${BUNDLE}/.env.example"

          # One implementation of every deploy step, in bash. Windows shops run
          # these same scripts inside a WSL2 distro (see wsl/bootstrap-wsl.ps1),
          # so there is no second, drifting PowerShell copy to keep in sync.
          cp deploy/onprem/install.sh \
             deploy/onprem/watchdog.sh \
             deploy/onprem/register-autostart.sh \
             deploy/onprem/update-agent.sh \
             deploy/onprem/update.sh \
             deploy/onprem/update-lib.sh \
             deploy/onprem/disable-watchdog.sh \
             deploy/onprem/discovery-responder.py \
             deploy/onprem/migrate-fahd.sh \
             deploy/onprem/INSTALL.md deploy/onprem/README.md "${BUNDLE}/"

          echo "==> Staging the Windows (WSL) bootstrap…"
          mkdir -p "${BUNDLE}/wsl"
          cp deploy/onprem/wsl/bootstrap-wsl.ps1 \
             deploy/onprem/wsl/collect-diagnostics.ps1 \
             deploy/onprem/wsl/timezone-map.txt "${BUNDLE}/wsl/"
          mv wsl-rootfs/pointy-wsl-rootfs.tar.gz "${BUNDLE}/wsl/"
          if [ -f wsl-msi/wsl.msi ]; then
            cp wsl-msi/wsl.msi "${BUNDLE}/wsl/${WSL_MSI_ASSET}"
            echo "    bundled ${WSL_MSI_ASSET} (offline Windows install supported)"
          else
            echo "WARNING: no WSL MSI in this bundle. A Windows host without a modern" >&2
            echo "         wsl.exe will need internet to install one. Check that" >&2
            echo "         WSL_MSI_TAG/WSL_MSI_ASSET still match a microsoft/WSL release." >&2
          fi
          chmod +x "${BUNDLE}/install.sh" "${BUNDLE}/watchdog.sh" \
             "${BUNDLE}/register-autostart.sh" "${BUNDLE}/update-agent.sh" \
             "${BUNDLE}/update.sh" "${BUNDLE}/update-lib.sh" \
             "${BUNDLE}/discovery-responder.py" \
             "${BUNDLE}/migrate-fahd.sh" "${BUNDLE}/disable-watchdog.sh"

          # The bundle is unzipped on Windows and streamed into the distro. Any
          # CRLF that sneaks in makes bash fail with "\r: command not found", and
          # a CRLF in .env puts a trailing \r inside the generated Postgres
          # password — an authentication failure that only surfaces much later.
          echo "==> Asserting LF line endings on everything the distro executes…"
          bad=0
          for f in "${BUNDLE}"/*.sh "${BUNDLE}/discovery-responder.py" "${BUNDLE}/.env.example"; do
            if grep -qU $'\r' "${f}"; then echo "CRLF in ${f}" >&2; bad=1; fi
          done
          [ "${bad}" -eq 0 ] || { echo "ERROR: CRLF line endings in the bundle" >&2; exit 1; }
          echo "${VERSION}" > "${BUNDLE}/VERSION.txt"

          echo "==> Sanity-checking rendered Compose…"
          yq eval '.services | keys' "${BUNDLE}/docker-compose.yml"
          if grep -qE '^\s+build:' "${BUNDLE}/docker-compose.yml"; then
            echo "ERROR: build: section survived in the offline compose" >&2
            exit 1
          fi

          # STRICT parse of the exact file that goes in the zip, with the
          # .env.example that ships beside it. yq renders this file and yq
          # tolerates a duplicate mapping key - v0.6.1 shipped `stop_grace_period`
          # twice in `postgres` and the first thing to notice was `docker compose`
          # on a shop's machine, mid live-update. Render-then-grep is not a parse.
          bash "${GITHUB_WORKSPACE}/scripts/check_compose_parses.sh" \
            "${BUNDLE}/docker-compose.yml" "${BUNDLE}/.env.example"

          echo "==> Zipping the server half…"
          zip -r -q "dist/${BUNDLE}.zip" "${BUNDLE}"
          ls -lh dist "${BUNDLE}/images"

      # Handed straight to build-onprem, which appends clients/ to this same
      # zip. compression-level 0 because the payload is already a zip —
      # re-deflating a gigabyte of it would cost a minute and save nothing.
      - uses: actions/upload-artifact@v4
        with:
          name: pointy-onprem-partial
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # ---------------------------------------------------------------------------
  # On-prem server, part 2 — take the server half, add every client installer a
  # site could need (Android, Windows, the Windows 7/8/8.1 compat build, Linux
  # .deb and .tar.gz) plus the manifest the apps self-update from, then sign and
  # publish. One zip, one deployment, no second download at the shop.
  # ---------------------------------------------------------------------------
  build-onprem:
    name: Build on-prem bundle
    needs: [version, build-android, build-windows, build-linux, build-onprem-images]
    runs-on: ubuntu-latest
    # A job-level block replaces the workflow-level one outright, so contents
    # has to be restated: it attaches the bundle to the Release. actions lets
    # the last step delete the hand-off artifacts once they are consumed.
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      # The client builds from the android/windows/linux jobs are bundled so a
      # new shop's backend can serve them on the LAN and the client apps can
      # self-update from it.
      - name: Download Android client
        uses: actions/download-artifact@v4
        with:
          name: pointy-android
          path: client-artifacts
      - name: Download Windows client
        uses: actions/download-artifact@v4
        with:
          name: pointy-windows
          path: client-artifacts
      - name: Download Linux client
        uses: actions/download-artifact@v4
        with:
          name: pointy-linux
          path: client-artifacts
      - name: Download the server half of the bundle
        uses: actions/download-artifact@v4
        with:
          name: pointy-onprem-partial
          path: dist

      # The Windows 7/8/8.1 till build. It lives on a frozen branch with its own
      # toolchain and its own release (release-compat.yml), so it cannot be built
      # here — it is fetched from the newest published "-compat" release, or from
      # the tag a manual run names. Best-effort, like the WSL MSI: a bundle
      # without it is still a complete bundle for Windows 10+ tills.
      - name: Fetch the Windows 8 (compat) installer
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMPAT_TAG: ${{ github.event.inputs.compat_tag }}
        run: |
          set -euo pipefail
          mkdir -p compat-client
          tag="${COMPAT_TAG:-}"
          if [ -z "${tag}" ]; then
            tag="$(gh release list --limit 100 --json tagName,isDraft \
                     --jq '[.[] | select(.isDraft | not) | .tagName | select(endswith("-compat"))] | first')"
          fi
          [ -n "${tag}" ] && [ "${tag}" != "null" ] || {
            echo "no published -compat release to bundle" >&2; exit 1; }
          echo "==> Bundling the Windows 8 client from ${tag}"
          gh release download "${tag}" --pattern '*-windows-x64-setup.exe' --dir compat-client
          ls -lh compat-client

      - name: Add the client installers and the manifest
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="pointy-onprem-${VERSION}"
          ZIP="dist/${BUNDLE}.zip"
          [ -f "${ZIP}" ] || { echo "ERROR: ${ZIP} missing — did build-onprem-images run?" >&2; exit 1; }
          mkdir -p "${BUNDLE}/clients"

          # manifest.json is two things at once: the list the apps poll to
          # self-update (android/windows/linux, keyed by ClientPlatform enum
          # name) and, under "downloads", the installers a person picks off the
          # LAN page. A download is not an update target — the Linux .deb cannot
          # replace a running app, and the compat build is for machines the
          # modern installer refuses.
          manifest="$(jq -n --arg v "${VERSION}" '{version:$v, downloads:{}}')"

          add() { # add <update|download> <key> <path> [version]
            local where="$1" key="$2" path="$3" ver="${4:-}"
            if [ -z "${path}" ] || [ ! -f "${path}" ]; then
              echo "    ${key}: MISSING"
              return 0
            fi
            cp "${path}" "${BUNDLE}/clients/"
            local file sha size
            file="$(basename "${path}")"
            sha="$(sha256sum "${path}" | awk '{print $1}')"
            size="$(stat -c%s "${path}")"
            manifest="$(printf '%s' "${manifest}" | jq \
              --arg where "${where}" --arg k "${key}" --arg f "${file}" \
              --arg s "${sha}" --argjson z "${size}" --arg v "${ver}" \
              'def entry: {file:$f, sha256:$s, size:$z}
                 + (if $v == "" then {} else {version:$v} end);
               if $where == "update" then .[$k] = entry else .downloads[$k] = entry end')"
            echo "    ${key}: ${file} (${size} bytes)"
          }

          # The argument is a glob and has to stay unquoted so it expands here;
          # each pattern matches at most one artifact.
          # shellcheck disable=SC2012,SC2086
          first() { ls $1 2>/dev/null | head -1 || true; }

          echo "==> Staging client installers…"
          add update   android        "$(first 'client-artifacts/pointy-*-android-universal.apk')"
          add update   windows        "$(first 'client-artifacts/pointy-*-windows-x64-setup.exe')"
          add update   linux          "$(first 'client-artifacts/pointy-*-linux-x64.tar.gz')"
          add download linux_deb      "$(first 'client-artifacts/pointy-*-linux-x64.deb')"

          # Its version is its own — the compat branch releases on its own tags —
          # so it is carried on the entry rather than inherited from the bundle.
          compat="$(first 'compat-client/pointy-*-windows-x64-setup.exe')"
          compat_version=""
          if [ -n "${compat}" ]; then
            compat_version="$(basename "${compat}")"
            compat_version="${compat_version#pointy-}"
            compat_version="${compat_version%-windows-x64-setup.exe}"
          else
            echo "::warning title=No Windows 8 client::This bundle carries no compat installer. A Windows 7/8/8.1 till will have to be installed from its own -compat release."
          fi
          add download windows_compat "${compat}" "${compat_version}"

          printf '%s\n' "${manifest}" > "${BUNDLE}/clients/manifest.json"
          echo "==> Client manifest:"; cat "${BUNDLE}/clients/manifest.json"

          # -0: every one of these is already a compressed container (apk, deb,
          # tar.gz, lzma'd installer). Deflating them again buys nothing and
          # costs minutes on the critical path.
          zip -g -0 -r -q "${ZIP}" "${BUNDLE}/clients"
          ( cd dist && sha256sum "${BUNDLE}.zip" > SHA256SUMS-onprem.txt )
          ls -lh dist

      # Authenticity, separate from integrity. The sha256 above proves the
      # download was not corrupted; it proves nothing about who produced it,
      # because the relay serves both the bundle and its hash. This signature is
      # made with a key that never touches the relay, and update-agent.sh refuses
      # a bundle that fails it. See deploy/onprem/SIGNING.md.
      - name: Sign the on-prem bundle
        working-directory: .
        env:
          SIGNING_KEY: ${{ secrets.POINTY_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          zip_path="$(ls dist/*-onprem-*.zip dist/*.zip 2>/dev/null | head -1)"
          [ -n "$zip_path" ] || { echo "no bundle zip to sign" >&2; exit 1; }
          digest="$(sha256sum "$zip_path" | awk '{print $1}')"
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::warning title=Unsigned release::POINTY_RELEASE_SIGNING_KEY is not set — this bundle is UNSIGNED and shops with a release key configured will refuse it."
            exit 0
          fi
          umask 077
          keyfile="$(mktemp)"; msg="$(mktemp)"; raw="$(mktemp)"
          printf '%s' "$SIGNING_KEY" > "$keyfile"
          printf '%s' "$digest" > "$msg"
          openssl pkeyutl -sign -inkey "$keyfile" -rawin -in "$msg" -out "$raw"
          base64 -w0 < "$raw" > "${zip_path}.sig"
          rm -f "$keyfile" "$msg" "$raw"
          echo "signed sha256=${digest}"
          echo "  -> ${zip_path}.sig"

      # Test builds only. This is by far the largest artifact — it packs all
      # seven docker image tars — and at ~1 GB it was the biggest single draw on
      # the 2 GB Actions storage quota that GitHub reported 90% full on
      # 2026-09-11. On a real release the very same zip is attached to the
      # GitHub Release in the next step, which is separate storage and free, so
      # uploading it here bought a second copy of a file nothing downstream
      # consumes. A manual test build has no Release to attach to and this
      # artifact is the only way to get the bundle out, so there it still runs.
      - uses: actions/upload-artifact@v4
        if: ${{ needs.version.outputs.is_release != 'true' }}
        with:
          name: pointy-onprem
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Attach to release
        if: ${{ needs.version.outputs.is_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.version.outputs.tag }}" dist/* --clobber

      # Hand-off artifacts exist so one job can pass a file to the next, not so
      # a person can download them. retention-days: 1 still left ~1.8 GB of them
      # resident for a full day per run — two runs on 2026-09-08 peaked at 4 GB
      # against a 2 GB quota — so drop them the moment they have been consumed.
      #
      # The server half goes either way: the full bundle above supersedes it and
      # nothing can use it alone. The client installers go only on a real
      # release, where they are already Release assets; on a test build they are
      # the only copy anyone can reach, so they stay.
      #
      # success() only, because a failed run has to keep its inputs for a re-run
      # of this job. continue-on-error because this is housekeeping: a quota is
      # never worth failing a release over.
      - name: Drop the consumed hand-off artifacts
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          IS_RELEASE: ${{ needs.version.outputs.is_release }}
        run: |
          set -euo pipefail
          consumed="pointy-onprem-partial"
          if [ "${IS_RELEASE}" = "true" ]; then
            consumed="${consumed} pointy-android pointy-windows pointy-linux"
          fi
          for name in ${consumed}; do
            ids="$(gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq ".artifacts[] | select(.name == \"${name}\") | .id")"
            for id in ${ids}; do
              echo "==> dropping ${name} (artifact ${id})"
              gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            done
          done

  # ---------------------------------------------------------------------------
  # Hosted relay — build the relay image and push it to GitHub Container
  # Registry (ghcr.io) so the company-run JPaaS environment can pull and run it.
  # This is the *central* relay that phones + on-prem connectors reach; it is
  # separate from the relay image baked into the offline on-prem bundle above
  # (that one stays registry-free for air-gapped sites).
  #
  # The ghcr package is PUBLIC on purpose: the image carries no secrets (it is
  # just the stripped static Go binary on Alpine — the admin token, DB/Redis
  # URLs and the OpenRouter key are all injected as env vars on the JPaaS node,
  # POINTY_RELAY_PLATFORM=paas), and public ghcr storage is unlimited and free,
  # whereas private package versions accumulate on every release and exhaust the
  # Free-tier storage quota ("Artifact storage quota has been hit"). Because it
  # is public, JPaaS can pull it anonymously — no read:packages token needed.
  # Runs off `version` only, so it ships without waiting on the Android/Windows
  # client builds.
  # ---------------------------------------------------------------------------
  publish-relay:
    name: Publish relay image (ghcr)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push to ghcr.io
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name (ghcr requires lowercase)
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "ref=ghcr.io/${OWNER,,}/pointy-relay" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build relay image
        run: >
          docker build -f relay/Dockerfile
          --build-arg POINTY_VERSION=${{ needs.version.outputs.version }}
          -t "${{ steps.image.outputs.ref }}:${{ needs.version.outputs.version }}" .

      # Move :latest only for real releases so JPaaS can track a stable tag;
      # manual test builds (workflow_dispatch) publish just their version tag.
      - name: Tag :latest (releases only)
        if: ${{ needs.version.outputs.is_release == 'true' }}
        run: docker tag "${{ steps.image.outputs.ref }}:${{ needs.version.outputs.version }}" "${{ steps.image.outputs.ref }}:latest"

      - name: Push relay image
        run: docker push --all-tags "${{ steps.image.outputs.ref }}"
