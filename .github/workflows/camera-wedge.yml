# The counter camera's native engine (frontend/packages/pointy_camera_wedge):
# its tests under MSVC — the compiler the Windows tills' build uses — and
# under GCC with sanitizers; the Media Foundation backend on real Windows; the
# V4L2 backend against real kernel camera drivers on Linux; and the package
# built into the Flutter app on both, the way release.yml builds it.
#
# release.yml only compiles the apps when a release is cut; this catches a
# break in the C++ the day it is made. It runs only when the package (or this
# file) changes.
name: Camera wedge (native)

on:
  pull_request:
    paths:
      - "frontend/packages/pointy_camera_wedge/**"
      - ".github/workflows/camera-wedge.yml"
  push:
    branches: [main]
    paths:
      - "frontend/packages/pointy_camera_wedge/**"
      - ".github/workflows/camera-wedge.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.6"
  PACKAGE_DIR: frontend/packages/pointy_camera_wedge

jobs:
  windows-engine:
    name: Windows engine (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests on drawn barcodes (synthetic camera)
        shell: pwsh
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S src -B build/tests -DPCW_BUILD_TESTS=ON
          cmake --build build/tests --config Release --parallel
          ./build/tests/Release/pcw_tests.exe
          if ($LASTEXITCODE -ne 0) { throw "native tests failed" }

      - name: Media Foundation backend and probe
        shell: pwsh
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S src -B build/probe -DPCW_BUILD_PROBE=ON
          cmake --build build/probe --config Release --parallel
          # A hosted runner has no camera, which is itself a path worth
          # running: Media Foundation starts, enumerates nothing, and the
          # engine reports "no camera" and keeps retrying until told to stop.
          # Windows Server images may lack the Media Foundation feature, in
          # which case the build is the check.
          if (Test-Path "$env:WINDIR\System32\mfplat.dll") {
            ./build/probe/Release/camera_wedge_probe.exe --list
            if ($LASTEXITCODE -ne 0) { throw "probe --list failed" }
            ./build/probe/Release/camera_wedge_probe.exe --seconds 4
            if ($LASTEXITCODE -ne 0) { throw "probe run failed" }
          } else {
            Write-Host "Media Foundation not installed on this runner; build checked, run skipped."
          }

      # The console probe, for checking a camera on a real till without
      # installing the app (see the package README).
      - uses: actions/upload-artifact@v4
        with:
          name: camera-wedge-probe-windows
          path: |
            ${{ env.PACKAGE_DIR }}/build/probe/Release/camera_wedge_probe.exe
          if-no-files-found: error
          retention-days: 14

  linux-engine:
    name: Engine under sanitizers (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests with AddressSanitizer + UBSan
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          flags="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          cmake -S src -B build/asan -DPCW_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="$flags" -DCMAKE_CXX_FLAGS="$flags" \
            -DCMAKE_EXE_LINKER_FLAGS="$flags" -DCMAKE_SHARED_LINKER_FLAGS="$flags"
          cmake --build build/asan --parallel
          ASAN_OPTIONS=detect_leaks=0 build/asan/pcw_tests

      - name: Tests with ThreadSanitizer
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          cmake -S src -B build/tsan -DPCW_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS=-fsanitize=thread -DCMAKE_CXX_FLAGS=-fsanitize=thread \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread
          cmake --build build/tsan --parallel
          TSAN_OPTIONS=halt_on_error=1 build/tsan/pcw_tests

  linux-v4l2:
    name: Linux backend on real V4L2 drivers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The runner has no camera, but its kernel can have two V4L2 drivers
      # that behave like one: vivid (the kernel's own virtual camera, with a
      # simulated USB unplug) and v4l2loopback (a real V4L2 camera that
      # v4l2_loopback_feed writes drawn barcodes into). The same scenarios run
      # from a Mac under QEMU: `make frontend-camera-wedge-linux`.
      - name: Camera drivers in the runner's kernel
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" \
            "linux-headers-$(uname -r)" v4l2loopback-dkms v4l-utils
          if sudo modprobe vivid n_devs=1 node_types=0x1 multiplanar=1 vid_cap_nr=10; then
            echo "PCW_NO_VIVID=0" >> "$GITHUB_ENV"
          else
            echo "::warning::vivid is not in this runner's kernel ($(uname -r)); its scenarios are skipped"
            echo "PCW_NO_VIVID=1" >> "$GITHUB_ENV"
          fi
          sudo modprobe v4l2loopback devices=1 video_nr=20 exclusive_caps=1 card_label=PointyLoopback
          v4l2-ctl --list-devices || true

      - name: Library, probe and loopback feeder
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          cmake -S src -B build/linux -DCMAKE_BUILD_TYPE=Release \
            -DPCW_BUILD_PROBE=ON -DPCW_BUILD_LOOPBACK_FEED=ON
          cmake --build build/linux --parallel
          # Built on 24.04, it must still load on Mint 21 (22.04).
          sh src/tools/check_linux_library.sh build/linux/libpointy_camera_wedge.so

      - name: Scenarios against the drivers
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          sudo env PATH="$PWD/build/linux:$PATH" PCW_NO_VIVID="$PCW_NO_VIVID" \
            sh src/tools/v4l2_scenarios.sh

      # The console probe for Linux tills, as portable as the library.
      - uses: actions/upload-artifact@v4
        with:
          name: camera-wedge-probe-linux
          path: ${{ env.PACKAGE_DIR }}/build/linux/camera_wedge_probe
          if-no-files-found: error
          retention-days: 14

  linux-app:
    name: Linux app build with the plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # As release.yml's build-linux installs them.
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: frontend
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Build
        working-directory: frontend
        run: |
          flutter gen-l10n
          flutter build linux --release

      - name: The library ships in the bundle, loadable on Mint 21
        working-directory: frontend
        run: |
          set -euo pipefail
          library=build/linux/x64/release/bundle/lib/libpointy_camera_wedge.so
          test -f "$library" || { echo "libpointy_camera_wedge.so is not in the bundle's lib/"; exit 1; }
          sh packages/pointy_camera_wedge/src/tools/check_linux_library.sh "$library"

      # Not a gate: what every other binary in the bundle needs, since a till
      # whose glibc or libstdc++ is older than any of these cannot start the
      # app at all, camera or not.
      - name: What the rest of the bundle needs (informational)
        working-directory: frontend/build/linux/x64/release/bundle
        run: |
          for elf in pointy_frontend lib/*.so; do
            versions=$(objdump -T "$elf" 2>/dev/null | grep -oE '(GLIBC|GLIBCXX)_[0-9.]+' | sort -t_ -k2 -V |
              awk -F_ '{ newest[$1] = $0 } END { for (k in newest) printf "%s ", newest[k] }')
            echo "$elf: $versions"
          done

  windows-app:
    name: Windows app build with the plugin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        working-directory: frontend
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter gen-l10n
          flutter build windows --release

      - name: The DLL ships next to the app
        shell: pwsh
        run: |
          $dll = Get-ChildItem frontend/build/windows -Recurse -Filter pointy_camera_wedge.dll |
                 Where-Object { $_.FullName -match 'runner\\Release' } | Select-Object -First 1
          if (-not $dll) { throw "pointy_camera_wedge.dll is not in the release output" }
          Write-Host "Found $($dll.FullName)"
